<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>XNL Flow - Active Sessions</title>
  <style>
    body {
      background-color: #0b0e14;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      margin: 0;
      padding: 32px;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 4px;
    }
    p.subtitle {
      color: #8fa0be;
      font-size: 13px;
      margin: 0 0 20px;
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    button {
      background-color: #2b3548;
      color: #ffffff;
      border: 1px solid #364153;
      border-radius: 6px;
      padding: 7px 14px;
      font-size: 13px;
      cursor: pointer;
    }
    button:hover {
      background-color: #364153;
    }
    #refreshed-at {
      color: #8fa0be;
      font-size: 12px;
    }
    .summary {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 36px;
      margin-bottom: 18px;
      min-height: 52px;
    }
    .stat-number {
      font-size: 26px;
      font-weight: 600;
      line-height: 1.1;
    }
    .stat-label {
      color: #8fa0be;
      font-size: 12px;
      margin-top: 2px;
    }
    .stat-note {
      color: #8fa0be;
      font-size: 11px;
      margin-top: 2px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th {
      text-align: left;
      color: #8fa0be;
      font-weight: 600;
      padding: 8px 10px;
      border-bottom: 1px solid #1f293d;
    }
    td {
      padding: 8px 10px;
      border-bottom: 1px solid #1a2232;
    }
    tr:hover td {
      background-color: #131822;
    }
    .device-cell {
      color: #8fa0be;
      font-size: 12px;
      max-width: 420px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #message {
      color: #8fa0be;
      font-size: 13px;
    }
    #message.error {
      color: #ff5252;
    }
  </style>
</head>
<body>
  <h1>Active Sessions</h1>
  <p class="subtitle">Everyone currently signed in to XNL Flow</p>

  <div class="toolbar">
    <button id="refresh-btn">Refresh</button>
    <span id="refreshed-at"></span>
  </div>

  <div id="summary" class="summary"></div>
  <div id="message"></div>
  <table id="sessions-table" style="display: none;">
    <thead>
      <tr>
        <th>Email</th>
        <th>Signed in</th>
        <th>Last active</th>
        <th>Device</th>
      </tr>
    </thead>
    <tbody id="sessions-body"></tbody>
  </table>

  <script>
    const BACKEND_HTTP = window.location.origin;
    const messageEl = document.getElementById('message');
    const tableEl = document.getElementById('sessions-table');
    const tbodyEl = document.getElementById('sessions-body');
    const refreshedAtEl = document.getElementById('refreshed-at');
    const summaryEl = document.getElementById('summary');

    // A raw user-agent string is long and mostly noise - this keeps just
    // enough to tell browsers/devices apart at a glance (e.g. "Chrome on
    // Mac", "Safari on iPhone") without a full parsing library.
    function summarizeUserAgent(ua) {
      if (!ua) return 'Unknown device';
      let os = 'Unknown OS';
      if (/iPhone/.test(ua)) os = 'iPhone';
      else if (/iPad/.test(ua)) os = 'iPad';
      else if (/Android/.test(ua)) os = 'Android';
      else if (/Mac OS X/.test(ua)) os = 'Mac';
      else if (/Windows/.test(ua)) os = 'Windows';
      else if (/Linux/.test(ua)) os = 'Linux';

      let browser = 'Unknown browser';
      if (/Edg\//.test(ua)) browser = 'Edge';
      else if (/OPR\//.test(ua)) browser = 'Opera';
      else if (/Chrome\//.test(ua)) browser = 'Chrome';
      else if (/CriOS\//.test(ua)) browser = 'Chrome';
      else if (/Firefox\//.test(ua)) browser = 'Firefox';
      else if (/Safari\//.test(ua)) browser = 'Safari';

      return `${browser} on ${os}`;
    }

    // "Signed in" = has at least one active session. Counted as DISTINCT
    // emails rather than raw rows, so a user who somehow holds more than
    // one session (the per-user limit is a database value that can be
    // raised) is still one person, not several.
    function summarizeSessions(sessions) {
      const emails = new Set(sessions.map((s) => String(s.email).toLowerCase()));
      return { users: emails.size, sessions: sessions.length };
    }

    // Three different questions, three figures:
    //   Signed up  - every account that exists (from the server)
    //   Signed in  - accounts holding a session, i.e. not logged out. A
    //                session lasts until logout or eviction, so this is
    //                NOT the same as being active.
    //   Online now - accounts with a live connection this moment (server)
    // A figure the server didn't send (e.g. this page deployed before the
    // matching server update) shows a dash rather than a wrong number.
    // "??" not "||": a genuine 0 must display as 0.
    function renderSummary(sessions, stats) {
      const { users, sessions: sessionCount } = summarizeSessions(sessions);
      summaryEl.textContent = '';
      const stat = (value, label, note) => {
        const box = document.createElement('div');
        box.className = 'stat';
        const number = document.createElement('div');
        number.className = 'stat-number';
        number.textContent = String(value);
        const caption = document.createElement('div');
        caption.className = 'stat-label';
        caption.textContent = label;
        box.appendChild(number);
        box.appendChild(caption);
        if (note) {
          const noteEl = document.createElement('div');
          noteEl.className = 'stat-note';
          noteEl.textContent = note;
          box.appendChild(noteEl);
        }
        summaryEl.appendChild(box);
      };
      stat(stats?.totalUsers ?? '–', 'Signed up');
      stat(users, 'Signed in', sessionCount !== users ? `${sessionCount} active sessions` : '');
      stat(stats?.onlineUsers ?? '–', 'Online now');
    }

    function setMessage(text, isError) {
      messageEl.textContent = text || '';
      messageEl.className = isError ? 'error' : '';
    }

    async function loadSessions() {
      setMessage('Loading...', false);
      summaryEl.textContent = '';
      tableEl.style.display = 'none';

      let res;
      try {
        res = await fetch(`${BACKEND_HTTP}/admin/sessions`, { credentials: 'include' });
      } catch (err) {
        setMessage(`Can't reach the backend: ${err.message}`, true);
        return;
      }

      if (res.status === 401) {
        setMessage('Not signed in. Sign in at the main site first, then reload this page.', true);
        return;
      }
      if (res.status === 403) {
        setMessage('This account is not on the admin list.', true);
        return;
      }
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        setMessage(data.error || `Request failed (status ${res.status})`, true);
        return;
      }

      const data = await res.json();
      const sessions = data.sessions || [];

      renderSummary(sessions, data.stats);

      if (sessions.length === 0) {
        setMessage('No one is currently signed in.', false);
        return;
      }

      setMessage('', false);
      tbodyEl.textContent = '';
      for (const s of sessions) {
        // Cells are filled with textContent / property assignment, never
        // by building an HTML string: email and user-agent are values a
        // visitor controls (password sign-up accepts any text containing
        // an "@"), so treating them as HTML would let a crafted sign-up
        // run script in the admin's browser.
        const tr = document.createElement('tr');
        const cell = (text) => {
          const td = document.createElement('td');
          td.textContent = text;
          tr.appendChild(td);
          return td;
        };
        cell(s.email);
        cell(new Date(s.created_at).toLocaleString());
        cell(new Date(s.last_seen_at).toLocaleString());
        const deviceCell = cell(summarizeUserAgent(s.user_agent));
        deviceCell.className = 'device-cell';
        deviceCell.title = s.user_agent || '';
        tbodyEl.appendChild(tr);
      }
      tableEl.style.display = '';
      refreshedAtEl.textContent = `Updated ${new Date().toLocaleTimeString()}`;
    }

    document.getElementById('refresh-btn').addEventListener('click', loadSessions);
    loadSessions();
  </script>
</body>
</html>
