<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Option Flow</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #0b0e14;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
    }

    .global-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 12px;
      background-color: #0b0e14;
      border-bottom: 1px solid #1f293d;
      flex-shrink: 0;
    }

    .global-bar select {
      background-color: #1f293d;
      color: #ffffff;
      border: 1px solid #364153;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }

    .global-bar {
      position: relative; /* anchor for the leaderboard dropdown */
    }

    .leaderboard-btn {
      background-color: #2b3548;
      color: #ffffff;
      border: 1px solid #364153;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }

    .leaderboard-btn:hover {
      background-color: #364153;
    }

    .leaderboard-panel {
      position: absolute;
      top: 44px;
      left: 12px;
      z-index: 50;
      background-color: #131822;
      border: 1px solid #1f293d;
      border-radius: 8px;
      padding: 12px;
      min-width: 260px;
      max-height: 340px;
      overflow-y: auto;
    }

    .leaderboard-panel.hidden {
      display: none;
    }

    .leaderboard-panel h4 {
      margin: 0 0 6px 0;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #8fa0be;
    }

    .leaderboard-header {
      display: flex;
      align-items: baseline;
      gap: 10px;
      padding: 0 6px 4px 6px;
      margin-bottom: 4px;
      border-bottom: 1px solid #1f293d;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .leaderboard-item {
      display: flex;
      align-items: baseline;
      gap: 10px;
      padding: 5px 6px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }

    .leaderboard-item:hover {
      background-color: #1f293d;
    }

    .leaderboard-rank {
      color: #8fa0be;
      font-size: 11px;
      width: 16px;
      flex-shrink: 0;
    }

    .leaderboard-symbol {
      flex: 1;
      font-weight: 600;
    }

    .leaderboard-symbol.call-heavy { color: #00c853; }
    .leaderboard-symbol.put-heavy { color: #ff5252; }

    .leaderboard-call {
      color: #00c853;
      font-size: 12px;
      min-width: 46px;
      text-align: right;
    }

    .leaderboard-put {
      color: #ff5252;
      font-size: 12px;
      min-width: 46px;
      text-align: right;
    }

    .panels-row {
      display: flex;
      flex-direction: row;
      flex: 1;
      overflow: hidden;
    }

    .panel {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      border-right: 1px solid #1f293d;
    }

    .panel.hidden {
      display: none;
    }

    .panel:last-child {
      border-right: none;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      background-color: #0b0e14;
      border-bottom: 1px solid #1f293d;
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .toolbar label {
      font-size: 13px;
    }

    .toolbar input {
      background-color: #1f293d;
      color: #ffffff;
      border: 1px solid #364153;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      text-transform: uppercase;
      width: 90px;
    }

    .toolbar button {
      background-color: #2b3548;
      color: #ffffff;
      border: 1px solid #364153;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }

    .toolbar button:hover {
      background-color: #364153;
    }

    .toolbar select {
      background-color: #1f293d;
      color: #ffffff;
      border: 1px solid #364153;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      max-width: 150px;
    }

    .toolbar select:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .main-layout {
      display: flex;
      flex: 1;
      width: 100%;
      overflow: hidden;
    }

    .chart-wrapper {
      position: relative;
      flex: 1;
      min-height: 300px;
      min-width: 200px;
      overflow: hidden;
    }

    .chart-error-banner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 20;
      background-color: #2b1414;
      border: 1px solid #7a1f1f;
      color: #ffb4b4;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 13px;
      max-width: 85%;
      text-align: center;
      display: none;
    }

    .chart-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .ticker-overlay {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 10;
      display: flex;
      align-items: baseline;
      gap: 10px;
      pointer-events: none;
    }

    .ticker-symbol {
      font-size: 18px;
      font-weight: bold;
    }

    .ticker-price {
      font-size: 15px;
      color: #00c853;
    }

    .ticker-change {
      font-size: 13px;
      font-weight: 600;
    }

    .ws-debug {
      font-size: 10px;
      color: #8fa0be;
      font-family: monospace;
    }

    .status-badge {
      font-size: 11px;
      padding: 3px 7px;
      border-radius: 4px;
      background-color: #2b3548;
      color: #8fa0be;
    }

    .flow-panel {
      width: 190px;
      flex-shrink: 0;
      background-color: #131822;
      border-left: 1px solid #1f293d;
      padding: 10px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }

    .flow-title {
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 8px;
      color: #8fa0be;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      flex-shrink: 0;
    }

    /* Narrow screens (phones): side-by-side layouts don't fit without
       clipping content, so stack everything vertically instead. */
    @media (max-width: 700px) {
      .panels-row {
        flex-direction: column;
        overflow-y: auto;
        overflow-x: hidden;
      }

      .panel {
        border-right: none;
        border-bottom: 1px solid #1f293d;
        flex: none; /* let each panel take its natural stacked height, not fight for equal split */
      }

      .main-layout {
        flex-direction: column;
      }

      .chart-wrapper {
        min-height: 260px;
        min-width: 0;
      }

      .flow-panel {
        width: 100%;
        height: 220px;
        border-left: none;
        border-top: 1px solid #1f293d;
      }
    }

    .flow-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .flow-card {
      background-color: #1a2232;
      padding: 6px 8px;
      border-radius: 6px;
      border-left: 4px solid #8fa0be;
      font-size: 11px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .flow-card.call { border-left-color: #00c853; }
    .flow-card.put { border-left-color: #ff5252; }

    .flow-details {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .flow-strike { font-weight: bold; color: #ffffff; }
    .flow-premium { color: #00c853; font-weight: 600; }
    .flow-card.put .flow-premium { color: #ff5252; }

    .bigflow-toggle-btn {
      background-color: #2b3548;
      color: #ffffff;
      border: 1px solid #364153;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }

    .bigflow-toggle-btn:hover {
      background-color: #364153;
    }

    .bigflow-toggle-btn.active {
      background-color: #7a5f00;
      border-color: #a68100;
    }

    /* Big-flow entries (any expiration, not just the selected one) get a
       distinct gold border and an expiration-date line, so they're never
       confused with the normal single-expiration sidebar entries. */
    .flow-card.bigflow {
      border-left-color: #ffc107;
    }

    .flow-bigflow-tag {
      color: #ffc107;
      font-weight: 700;
      font-size: 10px;
      letter-spacing: 0.3px;
    }
  </style>

  <!-- Lightweight Charts v4 Standalone -->
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>

  <div class="global-bar">
    <label><strong>Layout:</strong></label>
    <select id="layout-select">
      <option value="2">2 Windows</option>
      <option value="1">1 Window</option>

    <label><strong>Min chart marker:</strong></label>
    <select id="marker-floor-select">
      <option value="0">Show all</option>
      <option value="10000">$10k+</option>
      <option value="25000">$25k+</option>
      <option value="50000" selected>$50k+</option>
      <option value="100000">$100k+</option>
      <option value="250000">$250k+</option>
      <option value="500000">$500k+</option>
      <option value="1000000">$1M+</option>
    </select>

    <button id="leaderboard-btn" class="leaderboard-btn">Premium Leaderboard</button>

      <div class="leaderboard-header">

  <div class="panel" data-panel-index="0">

    <div class="main-layout">

        <div class="ticker-overlay">

          <span class="ticker-change"></span>

      </div>

  </div>

  <div class="panel" data-panel-index="1">
    <div class="toolbar">
      <label><strong>Ticker:</strong></label>
      <input type="text" class="ticker-input" value="QQQ" placeholder="e.g. AMD" />
      <button class="search-btn">Load Chart</button>
      <label><strong>Expiration:</strong></label>
      <select class="expiration-select" disabled>
        <option value="">Loading...</option>
      </select>
      <button class="bigflow-toggle-btn">Big Flow: Off</button>
    </div>
    <div class="main-layout">
      <div class="chart-wrapper">
        <div class="ticker-overlay">
          <span class="ticker-symbol">QQQ</span>
          <span class="ticker-price">--</span>
          <span class="ticker-change"></span>
          <span class="status-badge">Disconnected</span>
          <span class="ws-debug"></span>
        </div>
        <div class="chart-container"></div>
        <div class="chart-error-banner"></div>
      </div>
      <div class="flow-panel">
        <div class="flow-title">Live Option Sweeps</div>
        <div class="flow-list"></div>
      </div>
    </div>
  </div>

  </div>

  <script>
    const BACKEND_HTTP = window.location.origin;
    const BACKEND_WS = `${window.location.protocol === 'https:' ? 'wss:' : 'ws:'}//${window.location.host}/ws`;

    const MIN_FLOW_PREMIUM = 25000;
    let CHART_MARKER_PREMIUM_FLOOR = 50000;
    const CHART_MARKER_MAX = 30;
    const SIDEBAR_FLOW_MAX = 60;
    const MARKER_SIZE = 4; // larger = further from the candle body
    const BIG_FLOW_THRESHOLD = 100000; // only genuinely large prints show in the "any expiration" alert feature - with 6 expirations x ~40 contracts, showing everything above MIN_FLOW_PREMIUM would be overwhelming

    async function fetchHistoricalBars(symbol) {
      let response;
      try {
        response = await fetch(`${BACKEND_HTTP}/api/bars?symbol=${encodeURIComponent(symbol)}`);
      } catch (networkErr) {
        throw new Error(`Can't reach the backend at ${BACKEND_HTTP} - it may be waking up from sleep (Render free tier), try again in a moment`);
      }
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || `Backend error: ${response.status}`);
      if (!data.bars || data.bars.length === 0) throw new Error('No bars returned for this symbol');
      return { bars: data.bars, previousClose: data.previousClose || null };
    }

    async function fetchAllExpirations(symbol) {
      const response = await fetch(`${BACKEND_HTTP}/api/expirations?symbol=${encodeURIComponent(symbol)}`);
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || `Backend error: ${response.status}`);
      if (!data.expirations || data.expirations.length === 0) throw new Error('No expirations returned');
      return data.expirations;
    }

    function formatExpirationLabel(dateStr) {
      const d = new Date(`${dateStr}T00:00:00Z`);
      return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' });
    }

    function formatTradeTime(timestampMs) {
      return new Date(timestampMs).toLocaleTimeString('en-US', {
        hour: 'numeric', minute: '2-digit', second: '2-digit',
      });
    }

    function isFuturesTicker(symbol) {
      return /^[A-Z]{1,3}[FGHJKMNQUVXZ]\d$/.test(symbol);
    }

    function computeMA(bars, period) {
      const points = [];
      for (let i = period - 1; i < bars.length; i++) {
        let sum = 0;
        for (let j = i - period + 1; j <= i; j++) sum += bars[j].close;
        points.push({ time: bars[i].time, value: sum / period });
      }
      return points;
    }

    function createPanel(index, defaultSymbol) {
      const root = document.querySelector(`[data-panel-index="${index}"]`);
      const els = {
        tickerInput: root.querySelector('.ticker-input'),
        searchBtn: root.querySelector('.search-btn'),
        expirationSelect: root.querySelector('.expiration-select'),
        tickerSymbol: root.querySelector('.ticker-symbol'),
        tickerPrice: root.querySelector('.ticker-price'),
        tickerChange: root.querySelector('.ticker-change'),
        wsDebug: root.querySelector('.ws-debug'),
        statusBadge: root.querySelector('.status-badge'),
        chartContainer: root.querySelector('.chart-container'),
        chartErrorBanner: root.querySelector('.chart-error-banner'),
        flowList: root.querySelector('.flow-list'),
        bigflowToggleBtn: root.querySelector('.bigflow-toggle-btn'),
      };

      const chart = LightweightCharts.createChart(els.chartContainer, {
        autoSize: true,
        layout: { background: { color: '#0b0e14' }, textColor: '#d1d4dc' },
        grid: { vertLines: { color: '#1f293d' }, horzLines: { color: '#1f293d' } },
        timeScale: { timeVisible: true, secondsVisible: false, barSpacing: 8 },
        rightPriceScale: { scaleMargins: { top: 0.3, bottom: 0.28 } },
      });

      const candlestickSeries = chart.addCandlestickSeries({
        upColor: '#00c853',
        downColor: '#ff5252',
        borderVisible: false,
        wickUpColor: '#00c853',
        wickDownColor: '#ff5252',
      });

      const volumeSeries = chart.addHistogramSeries({
        priceFormat: { type: 'volume' },
        priceScaleId: 'volume',
        priceLineVisible: false,
        lastValueVisible: false,
      });
      chart.priceScale('volume').applyOptions({ scaleMargins: { top: 0.8, bottom: 0 } });

      const ma9Series = chart.addLineSeries({ color: '#ffeb3b', lineWidth: 1, priceLineVisible: false, lastValueVisible: true, title: 'MA8', lineType: 1 });
      const ma20Series = chart.addLineSeries({ color: '#2196f3', lineWidth: 1, priceLineVisible: false, lastValueVisible: true, title: 'MA20' });

      const panel = {
        index,
        symbol: defaultSymbol,
        active: true,
        hasLoadedOnce: false,
        pendingWatchExpiration: null,
        chart,
        candlestickSeries,
        volumeSeries,
        ma9Series,
        ma20Series,
        closeHistory: [],
        previousClose: null,
        bigFlowEnabled: false,
        flowMarkers: [],
        lastBarTime: null,
        lastBarPrice: 0,
        lastBarOpen: 0,
        els,
        ws: null,
        wsQueue: [],
      };

      function connectWS() {
        panel.wsConnectCount = (panel.wsConnectCount || 0) + 1;
        console.log(`[ws:${panel.symbol}] connectWS() call #${panel.wsConnectCount} at ${new Date().toLocaleTimeString()}`);

        panel.ws = new WebSocket(BACKEND_WS);

        panel.ws.onopen = () => {
          console.log(`[ws:${panel.symbol}] onopen fired (connect #${panel.wsConnectCount}), hasLoadedOnce=${panel.hasLoadedOnce}`);
          panel.wsQueue.forEach((m) => panel.ws.send(JSON.stringify(m)));
          panel.wsQueue = [];

          if (panel.hasLoadedOnce && panel.active) {
            console.warn(`[ws:${panel.symbol}] RECONNECT-RESEND firing (connect #${panel.wsConnectCount}) - this duplicates the normal load's own subscribe if that already happened`);
            panel.sendWS({ type: 'subscribe_price', symbol: panel.symbol });
            const currentExpiration = els.expirationSelect.value;
            if (currentExpiration) panel.sendWS({ type: 'watch_flow', symbol: panel.symbol, expiration: currentExpiration });
          }
        };

        panel.ws.onmessage = (event) => {
          let msg;
          try { msg = JSON.parse(event.data); } catch (e) { return; }

          panel.wsMsgCount = (panel.wsMsgCount || 0) + 1;
          if (msg.type === 'flow') panel.wsFlowCount = (panel.wsFlowCount || 0) + 1;
          const nowStr = new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', second: '2-digit' });
          if (els.wsDebug) els.wsDebug.innerText = `#${panel.wsMsgCount} ${msg.type} @ ${nowStr} (flow seen: ${panel.wsFlowCount || 0})`;

          if (msg.type === 'price' && msg.symbol === panel.symbol) {
            panel.handlePriceTick(msg.price, msg.timeMs);
          } else if (msg.type === 'flow' && msg.kind === 'bigflow') {
            if (msg.premium < BIG_FLOW_THRESHOLD) return;
            panel.addOptionFlowMarker(msg.optionType, msg.strike, msg.premium, msg.timeMs, msg.side, formatExpirationLabel(msg.expiration));
          } else if (msg.type === 'flow') {
            if (msg.premium < MIN_FLOW_PREMIUM) return;
            panel.addOptionFlowMarker(msg.optionType, msg.strike, msg.premium, msg.timeMs, msg.side);
          } else if (msg.type === 'flow_watching') {
            console.log(`[flow:${panel.symbol}] watching ${msg.contractCount} contracts, expiration ${msg.expiration}`);
            if (msg.expiration === panel.pendingWatchExpiration) panel.pendingWatchExpiration = null;
          } else if (msg.type === 'big_flow_watching') {
            console.log(`[bigflow:${panel.symbol}] watching ${msg.contractCount} contracts across multiple expirations`);
          } else if (msg.type === 'flow_error') {
            console.error(`[flow:${panel.symbol}] ${msg.error}`);
            panel.pendingWatchExpiration = null;
          } else if (msg.type === 'alpaca_status') {
            if (isFuturesTicker(panel.symbol)) return;
            if (msg.status === 'connected') panel.setStatus('Live Feed Connected', '#1b5e20');
            else if (msg.status === 'error') panel.setStatus(`Feed error: ${msg.detail || ''}`, '#7a1f1f');
            else panel.setStatus('Disconnected');
          }
        };

        panel.ws.onerror = (err) => console.error(`[ws:${panel.symbol}] error on connect #${panel.wsConnectCount}`, err);
        panel.ws.onclose = (closeEvent) => {
          console.warn(`[ws:${panel.symbol}] onclose fired (connect #${panel.wsConnectCount}) code=${closeEvent.code} reason=${closeEvent.reason || 'none'} wasClean=${closeEvent.wasClean}`);
          panel.setStatus('Disconnected');
          setTimeout(connectWS, 2000);
        };
      }
      connectWS();

      panel.sendWS = function (msg) {
        if (panel.ws && panel.ws.readyState === WebSocket.OPEN) {
          panel.ws.send(JSON.stringify(msg));
        } else {
          panel.wsQueue.push(msg);
        }
      };

      panel.setStatus = function (text, bg) {
        els.statusBadge.innerText = text;
        if (bg) els.statusBadge.style.backgroundColor = bg;
      };

      panel.showChartError = function (message) {
        if (!message) { els.chartErrorBanner.style.display = 'none'; return; }
        els.chartErrorBanner.innerText = message;
        els.chartErrorBanner.style.display = 'block';
        console.error(`[chart:${panel.symbol}]`, message);
      };

      panel.updatePercentChange = function (price) {
        if (!panel.previousClose) {
          els.tickerChange.innerText = '';
          return;
        }
        const pct = ((price - panel.previousClose) / panel.previousClose) * 100;
        const sign = pct >= 0 ? '+' : '';
        els.tickerChange.innerText = `${sign}${pct.toFixed(2)}%`;
        els.tickerChange.style.color = pct >= 0 ? '#00c853' : '#ff5252';
      };

      panel.centerLastCandle = function () {
        const width = els.chartContainer.clientWidth || 600;
        const actualBars = Math.max(1, panel.closeHistory.length);
        const targetVisibleBars = Math.min(200, actualBars);
        const newBarSpacing = Math.max(2, Math.min(20, width / targetVisibleBars));
        const rightOffset = 10;
        chart.timeScale().applyOptions({ barSpacing: newBarSpacing, rightOffset });
        chart.timeScale().scrollToPosition(rightOffset, false);
        chart.priceScale('right').applyOptions({ autoScale: true });
      };

      panel.pause = function () {
        if (!panel.active) return;
        panel.active = false;
        panel.sendWS({ type: 'unsubscribe_price' });
        panel.sendWS({ type: 'unwatch_flow' });
      };

      panel.resume = function () {
        if (panel.active) return;
        panel.active = true;
        panel.sendWS({ type: 'subscribe_price', symbol: panel.symbol });
        const currentExpiration = els.expirationSelect.value;
        if (currentExpiration) panel.sendWS({ type: 'watch_flow', symbol: panel.symbol, expiration: currentExpiration });
        panel.centerLastCandle();
      };

      panel.renderFlowSidebarCard = function (type, strike, premiumStr, sideLabel, timeStr, expirationLabel) {
        const isCall = type === 'CALL';
        const card = document.createElement('div');
        card.className = `flow-card ${isCall ? 'call' : 'put'}${expirationLabel ? ' bigflow' : ''}`;
        card.innerHTML = `
          <div class="flow-details">
            ${expirationLabel ? `<span class="flow-bigflow-tag">ALL EXP &middot; ${expirationLabel}</span>` : ''}
            <span class="flow-strike">${panel.symbol} ${strike} ${type}</span>
            <span style="color: #8fa0be; font-size: 11px;">${sideLabel || 'BOUGHT'}${timeStr ? ' &middot; ' + timeStr : ''}</span>
          </div>
          <span class="flow-premium">${premiumStr}</span>
        `;
        els.flowList.prepend(card);
        if (els.flowList.children.length > SIDEBAR_FLOW_MAX) els.flowList.removeChild(els.flowList.lastChild);
      };

      panel.addOptionFlowMarker = function (type, strike, premiumVal, timestamp, side, expirationLabel) {
        if (!panel.lastBarTime) return;

        const isCall = type === 'CALL';
        const formattedPrem = `$${(premiumVal / 1000).toFixed(0)}k`;
        const sideLabel = side || 'BOUGHT';
        const timeStr = timestamp ? formatTradeTime(timestamp) : '';

        panel.renderFlowSidebarCard(type, strike, formattedPrem, sideLabel, timeStr, expirationLabel);

        if (premiumVal < CHART_MARKER_PREMIUM_FLOOR) return;

        panel.flowMarkers.push({
          time: panel.lastBarTime,
          position: isCall ? 'belowBar' : 'aboveBar',
          color: isCall ? '#00c853' : '#ff5252',
          shape: isCall ? 'arrowUp' : 'arrowDown',
          text: `${expirationLabel ? `[${expirationLabel}] ` : ''}${sideLabel} ${type} $${strike} (${formattedPrem})`,
          size: MARKER_SIZE,
          isCall,
          side: sideLabel,
        });
        if (panel.flowMarkers.length > CHART_MARKER_MAX) panel.flowMarkers.shift();

        candlestickSeries.setMarkers(panel.flowMarkers);
      };

      panel.handlePriceTick = function (tradePrice, timeMs) {
        const tradeTime = Math.floor(timeMs / 1000);
        const currentMinuteBucket = Math.floor(tradeTime / 60) * 60;

        if (currentMinuteBucket > panel.lastBarTime) {
          panel.lastBarTime = currentMinuteBucket;
          panel.lastBarOpen = tradePrice;
          candlestickSeries.update({
            time: currentMinuteBucket, open: tradePrice, high: tradePrice, low: tradePrice, close: tradePrice,
          });
          panel.closeHistory.push({ time: currentMinuteBucket, close: tradePrice });
        } else {
          candlestickSeries.update({
            time: panel.lastBarTime,
            open: panel.lastBarOpen,
            high: Math.max(panel.lastBarPrice, tradePrice),
            low: Math.min(panel.lastBarPrice, tradePrice),
            close: tradePrice,
          });
          if (panel.closeHistory.length > 0) {
            panel.closeHistory[panel.closeHistory.length - 1].close = tradePrice;
          }
        }

        const hist = panel.closeHistory;
        function updateMA(series, period) {
          if (hist.length < period) return;
          let sum = 0;
          for (let i = hist.length - period; i < hist.length; i++) sum += hist[i].close;
          series.update({ time: panel.lastBarTime, value: sum / period });
        }
        updateMA(ma9Series, 8);
        updateMA(ma20Series, 20);

        els.tickerPrice.innerText = `$${tradePrice.toFixed(2)}`;
        els.tickerPrice.style.color = tradePrice >= panel.lastBarPrice ? '#00c853' : '#ff5252';
        panel.updatePercentChange(tradePrice);
        panel.lastBarPrice = tradePrice;
      };

      panel.watchFlow = function (expiration) {
        if (!expiration) return;
        panel.pendingWatchExpiration = expiration;
        panel.sendWS({ type: 'watch_flow', symbol: panel.symbol, expiration, spotPrice: panel.lastBarPrice });

        setTimeout(() => {
          if (panel.pendingWatchExpiration === expiration && panel.active && panel.symbol) {
            console.warn(`[flow:${panel.symbol}] No confirmation received for ${expiration} - retrying`);
            panel.sendWS({ type: 'watch_flow', symbol: panel.symbol, expiration, spotPrice: panel.lastBarPrice });
          }
        }, 5000);
      };

      panel.loadExpirationsDropdown = async function () {
        const select = els.expirationSelect;
        select.disabled = true;
        select.innerHTML = '<option value="">Loading...</option>';

        try {
          const dates = await fetchAllExpirations(panel.symbol);
          select.innerHTML = dates.map((d) => `<option value="${d}">${formatExpirationLabel(d)}</option>`).join('');
          select.disabled = false;
          panel.watchFlow(select.value);
        } catch (err) {
          console.error(`[flow:${panel.symbol}] Failed to load expirations:`, err);
          select.innerHTML = '<option value="">Failed to load</option>';
        }
      };

      panel.loadInitialSeedData = async function (symbol) {
        const previousSymbol = panel.symbol;
        panel.symbol = symbol;

        panel.sendWS({ type: 'unwatch_flow' });
        panel.pendingWatchExpiration = null;

        els.tickerSymbol.innerText = symbol;
        els.tickerPrice.innerText = 'Loading...';
        els.flowList.innerHTML = '';
        panel.flowMarkers = [];
        candlestickSeries.setMarkers([]);
        panel.showChartError(null);
        if (!panel.hasLoadedOnce) panel.setStatus('Fetching price data...');

        let seedCandles;
        try {
          const result = await fetchHistoricalBars(symbol);
          seedCandles = result.bars;
          panel.previousClose = result.previousClose;
          console.log(`[chart:${symbol}] Loaded ${seedCandles.length} real bars`, seedCandles[seedCandles.length - 1]);
        } catch (err) {
          console.error(`[chart:${symbol}] Historical bars failed to load:`, err);
          panel.setStatus('Failed to load data', '#7a1f1f');
          panel.showChartError(`Couldn't load price history: ${err.message}`);
          els.tickerPrice.innerText = '--';
          els.tickerChange.innerText = '';
          candlestickSeries.setData([]);
          volumeSeries.setData([]);
          ma9Series.setData([]);
          ma20Series.setData([]);
          panel.closeHistory = [];
          panel.symbol = previousSymbol;
          return;
        }

        try {
          candlestickSeries.setData(seedCandles);
          volumeSeries.setData(seedCandles.map((b) => ({
            time: b.time,
            value: b.volume || 0,
            color: b.close >= b.open ? 'rgba(0, 200, 83, 0.5)' : 'rgba(255, 82, 82, 0.5)',
          })));
          panel.closeHistory = seedCandles.map((b) => ({ time: b.time, close: b.close }));
          ma9Series.setData(computeMA(seedCandles, 8));
          ma20Series.setData(computeMA(seedCandles, 20));
          panel.centerLastCandle();
          console.log(`[chart:${symbol}] setData succeeded, bars on chart:`, seedCandles.length);
        } catch (renderErr) {
          console.error(`[chart:${symbol}] setData threw:`, renderErr);
          panel.showChartError(`Chart failed to render candles: ${renderErr.message}`);
          return;
        }

        const last = seedCandles[seedCandles.length - 1];
        panel.lastBarTime = last.time;
        panel.lastBarPrice = last.close;
        panel.lastBarOpen = last.open;

        els.tickerPrice.innerText = `$${panel.lastBarPrice.toFixed(2)}`;
        els.tickerPrice.style.color = last.close >= last.open ? '#00c853' : '#ff5252';
        panel.updatePercentChange(panel.lastBarPrice);
        panel.hasLoadedOnce = true;

        panel.sendWS({ type: 'subscribe_price', symbol });

        // If big-flow (all expirations) was on for the previous ticker,
        // re-point it at the new one - the server just overwrites the
        // same tracked-contracts entry, no separate unwatch needed.
        if (panel.bigFlowEnabled) {
          panel.sendWS({ type: 'watch_big_flow', symbol, spotPrice: panel.lastBarPrice });
        }

        if (isFuturesTicker(symbol)) {
          panel.setStatus('(delayed)', '#2b3548');
          els.expirationSelect.disabled = true;
          els.expirationSelect.innerHTML = '<option value="">N/A (futures)</option>';
        } else {
          panel.loadExpirationsDropdown();
        }
      };

      els.searchBtn.addEventListener('click', () => {
        const symbol = els.tickerInput.value.trim().toUpperCase();
        if (symbol && symbol !== panel.symbol) panel.loadInitialSeedData(symbol);
      });
      els.tickerInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') els.searchBtn.click();
      });
      els.expirationSelect.addEventListener('change', (e) => {
        els.flowList.innerHTML = '';
        panel.flowMarkers = [];
        candlestickSeries.setMarkers([]);
        panel.watchFlow(e.target.value);
      });

      els.bigflowToggleBtn.addEventListener('click', () => {
        panel.bigFlowEnabled = !panel.bigFlowEnabled;
        els.bigflowToggleBtn.innerText = `Big Flow: ${panel.bigFlowEnabled ? 'On' : 'Off'}`;
        els.bigflowToggleBtn.classList.toggle('active', panel.bigFlowEnabled);

        if (panel.bigFlowEnabled) {
          panel.sendWS({ type: 'watch_big_flow', symbol: panel.symbol, spotPrice: panel.lastBarPrice });
        } else {
          panel.sendWS({ type: 'unwatch_big_flow' });
        }
      });

      window.addEventListener('resize', () => panel.centerLastCandle());

      return panel;
    }

    const panels = [
      createPanel(0, 'SPY'),
      createPanel(1, 'QQQ'),
    ];

    panels.forEach((p) => p.loadInitialSeedData(p.symbol));

    document.getElementById('layout-select').addEventListener('change', (e) => {
      const mode = e.target.value;
      const secondPanelRoot = document.querySelector('[data-panel-index="1"]');

      if (mode === '1') {
        secondPanelRoot.classList.add('hidden');
        panels[1].pause();
      } else {
        secondPanelRoot.classList.remove('hidden');
        panels[1].resume();
      }

      requestAnimationFrame(() => {
        panels[0].centerLastCandle();
        if (mode === '2') panels[1].centerLastCandle();
      });
    });

    document.getElementById('marker-floor-select').addEventListener('change', (e) => {
      CHART_MARKER_PREMIUM_FLOOR = parseInt(e.target.value, 10);
    });

    function formatPremiumTotal(n) {
      if (n >= 1_000_000) return `$${(n / 1_000_000).toFixed(2)}M`;
      return `$${(n / 1000).toFixed(0)}k`;
    }

    function leaderboardItemHtml(entry, rank) {
      const putHeavy = entry.put > entry.call;
      return `<div class="leaderboard-item" data-symbol="${entry.symbol}">` +
        `<span class="leaderboard-rank">${rank}</span>` +
        `<span class="leaderboard-symbol ${putHeavy ? 'put-heavy' : 'call-heavy'}">${entry.symbol}</span>` +
        `<span class="leaderboard-call">${formatPremiumTotal(entry.call)}</span>` +
        `<span class="leaderboard-put">${formatPremiumTotal(entry.put)}</span>` +
        `</div>`;
    }

    async function loadLeaderboard() {
      const listEl = document.getElementById('leaderboard-list');
      listEl.innerText = 'Loading...';

      try {
        const res = await fetch(`${BACKEND_HTTP}/api/premium-leaderboard`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || `Request failed: ${res.status}`);

        if (!data.ready) {
          listEl.innerText = 'Still setting up - try again in a moment';
          return;
        }

        const rankings = data.rankings || [];
        listEl.innerHTML = rankings.length
          ? rankings.slice(0, 15).map((entry, i) => leaderboardItemHtml(entry, i + 1)).join('')
          : 'No premium tracked yet today';
      } catch (err) {
        console.error('[leaderboard] failed to load:', err);
        listEl.innerText = 'Failed to load';
      }
    }

    document.getElementById('leaderboard-btn').addEventListener('click', () => {
      const panel = document.getElementById('leaderboard-panel');
      const opening = panel.classList.contains('hidden');
      panel.classList.toggle('hidden');
      if (opening) loadLeaderboard();
    });

    document.getElementById('leaderboard-panel').addEventListener('click', (e) => {
      const item = e.target.closest('.leaderboard-item');
      if (!item || !item.dataset.symbol) return;
      const symbol = item.dataset.symbol;
      panels[0].els.tickerInput.value = symbol;
      panels[0].loadInitialSeedData(symbol);
      document.getElementById('leaderboard-panel').classList.add('hidden');
    });

    let premiumCheckInterval = null;
    let premiumCheckSymbol = null;

    async function checkPremium(symbol) {
      const resultEl = document.getElementById('premium-check-result');
      try {
        const res = await fetch(`${BACKEND_HTTP}/api/premium?symbol=${encodeURIComponent(symbol)}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || `Request failed: ${res.status}`);

        const putHeavy = data.put > data.call;
        resultEl.innerHTML = `<span style="color:${putHeavy ? '#ff5252' : '#00c853'}; font-weight:600;">${data.symbol}</span> ` +
          `Calls <span style="color:#00c853;">${formatPremiumTotal(data.call)}</span> ` +
          `Puts <span style="color:#ff5252;">${formatPremiumTotal(data.put)}</span>` +
          (data.newlyTracked ? ' <span style="color:#8fa0be;">(just started tracking)</span>' : '');
      } catch (err) {
        console.error('[premium check] failed:', err);
        resultEl.innerText = 'Failed to check';
      }
    }

    function startPremiumCheck(symbol) {
      if (premiumCheckInterval) clearInterval(premiumCheckInterval);
      premiumCheckSymbol = symbol;
      document.getElementById('premium-check-result').innerText = 'Checking...';
      checkPremium(symbol);
      premiumCheckInterval = setInterval(() => checkPremium(symbol), 20_000);
    }

    document.getElementById('premium-check-btn').addEventListener('click', () => {
      const symbol = document.getElementById('premium-check-input').value.trim().toUpperCase();
      if (symbol) startPremiumCheck(symbol);
    });

    document.getElementById('premium-check-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') document.getElementById('premium-check-btn').click();
    });
  </script>
</body>
