          lineType,
          priceLineVisible: false,
          lastValueVisible: false,
        });

        const indicator = { id, type, period, lineStyle, lineType, color, series, currentValue: null };
        panel.indicators.push(indicator);
        panel.recomputeIndicator(indicator);
        panel.renderIndicatorList();
        saveChartSettings(panel);
      };

      panel.removeIndicator = function (id) {
        const idx = panel.indicators.findIndex((ind) => ind.id === id);
        if (idx === -1) return;
        const ind = panel.indicators[idx];
        chart.removeSeries(ind.series);
        panel.indicators.splice(idx, 1);
        panel.renderIndicatorList();
        saveChartSettings(panel);
      };

      // Renders the always-visible per-strike overlay rows on the chart -
      // called after every data refresh AND whenever the price->pixel
      // mapping might have shifted (ticks, resize, pan/zoom), same
      // tracking approach as the wall labels.
      panel.positionStrikeOverlay = function () {
        if (!panel.volumeProfileEnabled) {
          els.strikeOverlayContainer.innerHTML = '';
          return;
        }
        const height = els.chartContainer.clientHeight || 0;
        const fmtK = (n) => n >= 1000 ? `${(n / 1000).toFixed(0)}k` : `${n}`;
        const maxTotal = Math.max(1, ...panel.strikeOverlayData.map((d) => d.c + d.p));

        els.strikeOverlayContainer.innerHTML = panel.strikeOverlayData.map((d) => {
          const y = candlestickSeries.priceToCoordinate(d.strike);
          if (y == null || y < 0 || y > height) return '';
          const total = d.c + d.p;
          const barWidthPct = (total / maxTotal) * 100;
          const callSharePct = total > 0 ? (d.c / total) * 100 : 0;
          const putSharePct = total > 0 ? (d.p / total) * 100 : 0;
          return `<div class="strike-overlay-row${d.isWallRow ? ' wall-row' : ''}" style="top:${y}px;">` +
            `<span class="strike-overlay-strike">${d.strike}</span>` +
            `<div class="strike-overlay-bar-track">` +
            `<div class="strike-overlay-bar-fill" style="width:${barWidthPct}%;">` +
            `<div class="strike-overlay-bar-call" style="width:${callSharePct}%;"></div>` +
            `<div class="strike-overlay-bar-put" style="width:${putSharePct}%;"></div>` +
            `</div>` +
            `<span class="strike-overlay-text">C:${fmtK(d.c)} <span class="strike-overlay-call-pct">(${d.cPct}%)</span> P:${fmtK(d.p)} <span class="strike-overlay-put-pct">(${d.pPct}%)</span></span>` +
            `</div>` +
            `</div>`;
        }).join('');
      };

      // Mirrors positionStrikeOverlay exactly - same row/bar structure,
      // rendered into the separate GEX container (own lane, own colors -
      // see .gex-overlay-row CSS) so it can be shown alongside the volume
      // profile for direct comparison, not just as a replacement for it.
      panel.positionGexOverlay = function () {
        if (!panel.gexEnabled) {
          els.gexOverlayContainer.innerHTML = '';
          return;
        }
        const height = els.chartContainer.clientHeight || 0;
        const fmtGex = (n) => n >= 1000 ? `${(n / 1000).toFixed(1)}k` : n.toFixed(0);
        const maxTotal = Math.max(1, ...panel.gexStrikeData.map((d) => d.c + d.p));

        els.gexOverlayContainer.innerHTML = panel.gexStrikeData.map((d) => {
          const y = candlestickSeries.priceToCoordinate(d.strike);
          if (y == null || y < 0 || y > height) return '';
          const total = d.c + d.p;
          const barWidthPct = (total / maxTotal) * 100;
          const callSharePct = total > 0 ? (d.c / total) * 100 : 0;
          const putSharePct = total > 0 ? (d.p / total) * 100 : 0;
          return `<div class="strike-overlay-row gex-overlay-row${d.isWallRow ? ' wall-row' : ''}" style="top:${y}px;">` +
            `<span class="strike-overlay-strike">${d.strike}</span>` +
            `<div class="strike-overlay-bar-track">` +
            `<div class="strike-overlay-bar-fill" style="width:${barWidthPct}%;">` +
            `<div class="strike-overlay-bar-call" style="width:${callSharePct}%;"></div>` +
            `<div class="strike-overlay-bar-put" style="width:${putSharePct}%;"></div>` +
            `</div>` +
            `<span class="strike-overlay-text">C:${fmtGex(d.c)} P:${fmtGex(d.p)}</span>` +
            `</div>` +
            `</div>`;
        }).join('');
      };

      // Computes the "Call Wall" (strike with the most total call volume
      // today) and "Put Wall" (same, for puts) from Tradier's full option
      // chain - which already reports per-contract volume, so this is just
      // aggregation, no gamma/Greeks math needed. Drawn as horizontal
      // price lines on the candlestick chart.
      // Repositions the floating wall labels to sit just above their
      // line's current price level - called on every refresh, every live
      // tick, and on resize, since autoScale means the price->pixel
      // mapping shifts as new data comes in.
      panel.positionWallLabels = function () {
        const height = els.chartContainer.clientHeight || 0;

        function positionOne(price, labelEl) {
          if (price == null) { labelEl.style.display = 'none'; return; }
          const y = candlestickSeries.priceToCoordinate(price);
          if (y != null && y >= 0 && y <= height) {
            labelEl.style.display = 'block';
            labelEl.style.top = `${y}px`;
          } else {
            labelEl.style.display = 'none'; // off-screen (scrolled/zoomed away) - hide rather than show floating in the wrong place
          }
        }

        positionOne(panel.gexCallWallPrice, els.gexCallWallLabel);
        positionOne(panel.gexPutWallPrice, els.gexPutWallLabel);
        positionOne(panel.gexFlipPrice, els.gexFlipLabel);
        positionOne(panel.gexMagnetPrice, els.gexMagnetLabel);
        positionOne(panel.highAreaPrice, els.highAreaLabel);
        positionOne(panel.lowAreaPrice, els.lowAreaLabel);

        // Both walls on the same strike would otherwise stack their
        // labels directly on top of each other - flip Put Wall below
        // the line so they stay readable side by side.
        const gexSameStrike = panel.gexCallWallPrice != null && panel.gexPutWallPrice != null && panel.gexCallWallPrice === panel.gexPutWallPrice;
        els.gexPutWallLabel.classList.toggle('below-line', gexSameStrike);
      };

      // Restyles the Call/Put Wall lines "strong" (full opacity, normal
      // width, dashed) or "weak" (dimmed, thinner, dotted) based on
      // whether CURRENT PRICE sits above or below the Gamma Flip line -
      // the same regime the Flip line represents (dealer hedging dampens
      // moves above Flip, amplifies them below), just given a visual
      // expression on the walls themselves. This is a judgment call built
      // on the standard GEX theory, not something independently validated
      // with real track record in this app - "weak" means "less likely to
      // hold per the theory," not a guarantee either way. Uses
      // applyOptions() rather than removing/recreating the lines, so this
      // can run on every price tick cheaply, not just on the 60s refresh -
      // the regime can flip mid-session as price crosses Flip.
      panel.applyGexWallRegimeStyle = function () {
        if (!panel.gexCallWallLine && !panel.gexPutWallLine) return;
        const isStrong = panel.gexFlipPrice == null || panel.lastBarPrice == null || panel.lastBarPrice > panel.gexFlipPrice;

        if (panel.gexCallWallLine) {
          panel.gexCallWallLine.applyOptions({
            color: isStrong ? '#ffa726' : 'rgba(255, 167, 38, 0.35)',
            lineWidth: isStrong ? 2 : 1,
            lineStyle: isStrong ? LightweightCharts.LineStyle.Dashed : LightweightCharts.LineStyle.Dotted,
          });
        }
        if (panel.gexPutWallLine) {
          panel.gexPutWallLine.applyOptions({
            color: isStrong ? '#29b6f6' : 'rgba(41, 182, 246, 0.35)',
            lineWidth: isStrong ? 2 : 1,
            lineStyle: isStrong ? LightweightCharts.LineStyle.Dashed : LightweightCharts.LineStyle.Dotted,
          });
        }
        els.gexCallWallLabel.classList.toggle('weak', !isStrong);
        els.gexPutWallLabel.classList.toggle('weak', !isStrong);
      };

      // Recomputes and sets MACD data from the given bars, or clears all
      // three series when the toggle is off - single place both the
      // recompute call sites and the toggle checkbox go through.
      panel.updateMacd = function (bars) {
        if (!panel.macdEnabled) {
          macdHistSeries.setData([]);
          macdLineSeries.setData([]);
          macdSignalSeries.setData([]);
          return;
        }
        const macd = computeMACD(bars, MACD_FAST, MACD_SLOW, MACD_SIGNAL);
        macdHistSeries.setData(macd.histogram);
        macdLineSeries.setData(macd.macdLine);
        macdSignalSeries.setData(macd.signalLine);
      };

      // Countdown to when the current (still-forming) candle closes and
      // the next one starts, positioned right under the chart's native
      // last-price label. Reuses the same time-bucketing logic the price
      // tick handler uses to build candles, so it always agrees with what
      // the chart itself considers "now"'s candle.
      panel.positionCandleTimer = function () {
        const height = els.chartContainer.clientHeight || 0;
        const history = panel.closeHistory;
        if (!panel.intervalSeconds || !history || !history.length || panel.lastBarPrice == null) {
          els.candleTimer.style.display = 'none';
          return;
        }

        const currentBarTime = history[history.length - 1].time; // start of the still-forming candle, in seconds
        const closeTime = currentBarTime + panel.intervalSeconds;
        const remaining = Math.max(0, closeTime - Math.floor(Date.now() / 1000));
        const mins = Math.floor(remaining / 60);
        const secs = remaining % 60;
        els.candleTimer.innerText = `${mins}:${String(secs).padStart(2, '0')}`;

        const bars = candlestickSeries.data();
        const lastBar = bars[bars.length - 1];
        const isUp = lastBar ? panel.lastBarPrice >= lastBar.open : true;
        els.candleTimer.style.backgroundColor = isUp ? '#00c853' : '#ff5252';

        const y = candlestickSeries.priceToCoordinate(panel.lastBarPrice);
        if (y != null && y >= 0 && y <= height) {
          els.candleTimer.style.display = 'block';
          els.candleTimer.style.top = `${y + 9}px`; // flush against the bottom edge of the native price label box, so the color reads as one continuous block
        } else {
          els.candleTimer.style.display = 'none';
        }
      };

      // Finds swing highs/lows over the recent lookback, clusters nearby
      // ones into levels, scores each cluster by touch count (weighted
      // toward more recent touches), and draws the strongest few above and
      // below current price as dashed price lines. Called once per new
      // candle (see the price-tick handler) rather than every tick.
      panel.computeAndDrawSupportResistance = function () {
        // Old lines/labels first, always - if this is a toggle-off, that
        // alone is the whole job; if it's a normal recompute, stale ones
        // shouldn't linger underneath the new ones anyway.
        for (const line of panel.srLines) candlestickSeries.removePriceLine(line);
        panel.srLines = [];
        els.srLabelContainer.innerHTML = '';
        panel.srLevels = [];
        if (!panel.srEnabled) return;

        const bars = panel.sr15mBars.slice(-SR_LOOKBACK_BARS);
        const n = SR_FRACTAL_N;

        // Need at least a full window on both sides of some candidate
        // bars, plus a handful of candidates - otherwise skip rather than
        // draw levels from too little data.
        if (bars.length < n * 2 + 5 || panel.lastBarPrice == null) return;

        const swingHighs = [];
        const swingLows = [];
        // Exclude the last N bars from being CENTERS - a swing point needs
        // N confirmed neighbors on its right side too, which the most
        // recent bars don't have yet.
        for (let i = n; i < bars.length - n; i++) {
          let isHigh = true;
          let isLow = true;
          for (let j = i - n; j <= i + n; j++) {
            if (j === i) continue;
            if (bars[j].high > bars[i].high) isHigh = false;
            if (bars[j].low < bars[i].low) isLow = false;
          }
          if (isHigh) swingHighs.push({ price: bars[i].high, index: i });
          if (isLow) swingLows.push({ price: bars[i].low, index: i });
        }

        const lastIndex = bars.length - 1;
        const tolerance = panel.lastBarPrice * SR_CLUSTER_TOLERANCE_PCT;

        // Greedy clustering: sort by price, then fold each point into the
        // running cluster if it's within tolerance of that cluster's
        // average, else start a new cluster.
        function clusterPoints(points) {
          const sorted = [...points].sort((a, b) => a.price - b.price);
          const clusters = [];
          for (const pt of sorted) {
            const current = clusters[clusters.length - 1];
            if (current && Math.abs(pt.price - current.avgPrice) <= tolerance) {
              current.points.push(pt);
              current.avgPrice = current.points.reduce((sum, p) => sum + p.price, 0) / current.points.length;
            } else {
              clusters.push({ points: [pt], avgPrice: pt.price });
            }
          }
          // Recency-weighted touch score - a touch 5 bars ago counts for
          // much more than one 250 bars ago, so a level that's gone stale
          // naturally loses out to more current structure over time.
          return clusters.map((c) => ({
            price: c.avgPrice,
            score: c.points.reduce((sum, p) => sum + 1 / (1 + (lastIndex - p.index) / 50), 0),
          }));
        }

        const resistanceCandidates = clusterPoints(swingHighs)
          .filter((c) => c.price > panel.lastBarPrice)
          .sort((a, b) => b.score - a.score)
          .slice(0, SR_LEVELS_PER_SIDE)
          .sort((a, b) => a.price - b.price); // closest-to-price first for R1/R2 labeling

        const supportCandidates = clusterPoints(swingLows)
          .filter((c) => c.price < panel.lastBarPrice)
          .sort((a, b) => b.score - a.score)
          .slice(0, SR_LEVELS_PER_SIDE)
          .sort((a, b) => b.price - a.price); // closest-to-price first for S1/S2 labeling

        resistanceCandidates.forEach((c, i) => {
          panel.srLines.push(candlestickSeries.createPriceLine({
            price: c.price,
            color: '#ff5252',
            lineWidth: 1,
            lineStyle: LightweightCharts.LineStyle.Dashed,
            axisLabelVisible: false,
          }));
          const labelEl = document.createElement('div');
          labelEl.className = 'sr-label resistance-label';
          labelEl.innerText = `R${i + 1}`;
          els.srLabelContainer.appendChild(labelEl);
          panel.srLevels.push({ price: c.price, el: labelEl });
        });

        supportCandidates.forEach((c, i) => {
          panel.srLines.push(candlestickSeries.createPriceLine({
            price: c.price,
            color: '#00c853',
            lineWidth: 1,
            lineStyle: LightweightCharts.LineStyle.Dashed,
            axisLabelVisible: false,
          }));
          const labelEl = document.createElement('div');
          labelEl.className = 'sr-label support-label';
          labelEl.innerText = `S${i + 1}`;
          els.srLabelContainer.appendChild(labelEl);
          panel.srLevels.push({ price: c.price, el: labelEl });
        });

        panel.positionSRLabels();
      };

      // Repositions the floating R1/R2/S1/S2 labels to sit right on top of
      // their line - called after every recompute, and on every price
      // tick/resize/pan/zoom since the line's Y pixel position shifts with
      // all of those even though the price level itself hasn't changed.
      panel.positionSRLabels = function () {
        const height = els.chartContainer.clientHeight || 0;
        for (const level of panel.srLevels) {
          const y = candlestickSeries.priceToCoordinate(level.price);
          if (y != null && y >= 0 && y <= height) {
            level.el.style.display = 'block';
            level.el.style.top = `${y}px`;
          } else {
            level.el.style.display = 'none'; // off-screen (scrolled/zoomed away)
          }
        }
      };

      // Fetches and merges gamma x OI across the nearest
      // GEX_EXPIRATION_COUNT expirations (not just whichever one is
      // selected in the EXP dropdown) - a single expiration's open
      // interest is too thin a slice to represent real aggregate dealer
      // positioning. Failures are caught internally and return empty
      // maps rather than throwing, so a GEX-specific hiccup doesn't take
      // down the (unrelated) volume-based walls this runs alongside.
      panel.fetchGexData = async function () {
        const callGexByStrike = new Map();
        const putGexByStrike = new Map();
        let nearestExpirationOptions = []; // for Magnet below - needs the SINGLE nearest expiration in isolation, not blended across all 6 like the walls
        try {
          const allExpirations = await fetchAllExpirations(panel.symbol);
          const targetExpirations = allExpirations.slice(0, GEX_EXPIRATION_COUNT);
          const results = await Promise.all(targetExpirations.map((exp) =>
            fetch(`${BACKEND_HTTP}/api/chain?symbol=${encodeURIComponent(panel.symbol)}&expiration=${encodeURIComponent(exp)}`)
              .then((r) => r.json())
              .catch((err) => { console.error(`[gex:${panel.symbol}] chain fetch failed for ${exp}:`, err); return { options: [] }; })
          ));
          results.forEach((chainData, i) => {
            if (i === 0) nearestExpirationOptions = chainData.options || [];
            for (const o of chainData.options || []) {
              const gamma = o.greeks?.gamma;
              const oi = o.open_interest;
              if (gamma == null || !(oi > 0)) continue;
              const gexValue = gamma * oi * 100;
              const map = o.option_type === 'call' ? callGexByStrike : putGexByStrike;
              map.set(o.strike, (map.get(o.strike) || 0) + gexValue);
            }
          });
        } catch (err) {
          console.error(`[gex:${panel.symbol}] failed to fetch multi-expiration GEX data:`, err);
        }
        return { callGexByStrike, putGexByStrike, nearestExpirationOptions };
      };

      panel.refreshCallPutWalls = async function (expiration) {
        if (!expiration || isFuturesTicker(panel.symbol)) return;

        try {
          const [volumeRes, gexData] = await Promise.all([
            fetch(`${BACKEND_HTTP}/api/chain?symbol=${encodeURIComponent(panel.symbol)}&expiration=${encodeURIComponent(expiration)}`),
            panel.fetchGexData(),
          ]);
          const data = await volumeRes.json();
          if (!volumeRes.ok) throw new Error(data.error || `Request failed: ${volumeRes.status}`);
          const { callGexByStrike, putGexByStrike, nearestExpirationOptions } = gexData;

          const callVolumeByStrike = new Map();
          const putVolumeByStrike = new Map();
          for (const o of data.options || []) {
            const vol = parseFloat(o.volume) || 0;
            if (vol <= 0) continue;
            const map = o.option_type === 'call' ? callVolumeByStrike : putVolumeByStrike;
            map.set(o.strike, (map.get(o.strike) || 0) + vol);
          }

          const topStrike = (map) => {
            let best = null;
            let bestVol = -1;
            for (const [strike, vol] of map) {
              if (vol > bestVol) { bestVol = vol; best = strike; }
            }
            return best;
          };

          const callWall = topStrike(callVolumeByStrike);
          const putWall = topStrike(putVolumeByStrike);
          const gexCallWall = topStrike(callGexByStrike);
          const gexPutWall = topStrike(putGexByStrike);
          const gexFlip = computeGammaFlip(callGexByStrike, putGexByStrike);

          // Magnet / Magnet Alt: unlike the walls and Flip above (blended
          // across GEX_EXPIRATION_COUNT expirations), these are computed
          // from the SINGLE nearest expiration in isolation - pinning is
          // fundamentally about gamma/OI concentrated in the contract
          // expiring soonest, and blending in far-dated expirations would
          // dilute exactly the concentration that causes it.
          const magnetCombinedByStrike = new Map(); // gamma x OI, calls + puts combined (not signed/separated like the walls)
          for (const o of nearestExpirationOptions) {
            const gamma = o.greeks?.gamma;
            const oi = o.open_interest;
            if (gamma != null && oi > 0) {
              magnetCombinedByStrike.set(o.strike, (magnetCombinedByStrike.get(o.strike) || 0) + gamma * oi * 100);
            }
          }
          const gexMagnet = topStrike(magnetCombinedByStrike);

          const allStrikes = new Set([...callVolumeByStrike.keys(), ...putVolumeByStrike.keys()]);
          const sortedStrikes = [...allStrikes].sort((a, b) => a - b);
          const totalVolumeByStrike = new Map();
          for (const s of sortedStrikes) {
            totalVolumeByStrike.set(s, (callVolumeByStrike.get(s) || 0) + (putVolumeByStrike.get(s) || 0));
          }
          // High Area / Low Area: search up to 15 strikes above/below ATM
          // (ATM = strike closest to current price), then find the
          // FARTHEST-OUT strike on each side whose total volume still
          // clears ~35% of the busiest strike's volume in that range -
          // thin strikes beyond real activity get ignored, even if a
          // low-volume strike sits between ATM and the real boundary.
          // The 35% figure is a calibrated heuristic, not a universal
          // formula - it may need tuning against more real examples.
          let atmIdx = 0;
          let bestDist = Infinity;
          sortedStrikes.forEach((s, i) => {
            const d = Math.abs(s - panel.lastBarPrice);
            if (d < bestDist) { bestDist = d; atmIdx = i; }
          });

          const AREA_SEARCH_RADIUS = 15;
          const AREA_VOLUME_THRESHOLD_PCT = 0.35;
          const searchLowIdx = Math.max(0, atmIdx - AREA_SEARCH_RADIUS);
          const searchHighIdx = Math.min(sortedStrikes.length - 1, atmIdx + AREA_SEARCH_RADIUS);
          const candidateStrikes = sortedStrikes.slice(searchLowIdx, searchHighIdx + 1);
          const maxVolInRange = Math.max(1, ...candidateStrikes.map((s) => totalVolumeByStrike.get(s) || 0));
          const areaThreshold = maxVolInRange * AREA_VOLUME_THRESHOLD_PCT;

          let highArea = sortedStrikes[atmIdx];
          for (let i = searchHighIdx; i > atmIdx; i--) {
            if ((totalVolumeByStrike.get(sortedStrikes[i]) || 0) >= areaThreshold) { highArea = sortedStrikes[i]; break; }
          }
          let lowArea = sortedStrikes[atmIdx];
          for (let i = searchLowIdx; i < atmIdx; i++) {
            if ((totalVolumeByStrike.get(sortedStrikes[i]) || 0) >= areaThreshold) { lowArea = sortedStrikes[i]; break; }
          }

          const fmt = (n) => n >= 1000 ? `${(n / 1000).toFixed(0)}k` : `${n}`;
          const pctPair = (strike) => {
            const c = callVolumeByStrike.get(strike) || 0;
            const p = putVolumeByStrike.get(strike) || 0;
            const total = c + p;
            const cPct = total > 0 ? ((c / total) * 100).toFixed(0) : '0';
            const pPct = total > 0 ? ((p / total) * 100).toFixed(0) : '0';
            return { c, p, cPct, pPct };
          };

          if (panel.gexCallWallLine) { candlestickSeries.removePriceLine(panel.gexCallWallLine); panel.gexCallWallLine = null; }
          if (panel.gexPutWallLine) { candlestickSeries.removePriceLine(panel.gexPutWallLine); panel.gexPutWallLine = null; }
          if (panel.gexFlipLine) { candlestickSeries.removePriceLine(panel.gexFlipLine); panel.gexFlipLine = null; }
          if (panel.gexMagnetLine) { candlestickSeries.removePriceLine(panel.gexMagnetLine); panel.gexMagnetLine = null; }
          if (panel.highAreaLine) { candlestickSeries.removePriceLine(panel.highAreaLine); panel.highAreaLine = null; }
          if (panel.lowAreaLine) { candlestickSeries.removePriceLine(panel.lowAreaLine); panel.lowAreaLine = null; }

          // callWall/putWall themselves are still computed above and used
          // below (isWallRow highlighting + the strike range for the
          // volume profile overlay) - only THEIR chart lines/labels stay
          // removed; High/Low Area are back to being drawn again below.
          panel.gexCallWallPrice = gexCallWall;
          panel.gexPutWallPrice = gexPutWall;
          panel.gexFlipPrice = gexFlip;
          panel.gexMagnetPrice = gexMagnet;
          panel.highAreaPrice = highArea;
          panel.lowAreaPrice = lowArea;

          if (gexCallWall != null) {
            panel.gexCallWallLine = candlestickSeries.createPriceLine({
              price: gexCallWall,
              color: '#ffa726',
              lineWidth: 2,
              lineStyle: LightweightCharts.LineStyle.Dashed,
              axisLabelVisible: true,
            });
            els.gexCallWallLabel.innerText = `GEX Call Wall ${gexCallWall}`;
          }
          if (gexPutWall != null) {
            panel.gexPutWallLine = candlestickSeries.createPriceLine({
              price: gexPutWall,
              color: '#29b6f6',
              lineWidth: 2,
              lineStyle: LightweightCharts.LineStyle.Dashed,
              axisLabelVisible: true,
            });
            els.gexPutWallLabel.innerText = `GEX Put Wall ${gexPutWall}`;
          }
          if (gexFlip != null) {
            panel.gexFlipLine = candlestickSeries.createPriceLine({
              price: gexFlip,
              color: '#e0e0e0',
              lineWidth: 1,
              lineStyle: LightweightCharts.LineStyle.Solid,
              axisLabelVisible: true,
            });
            els.gexFlipLabel.innerText = `Gamma Flip ${gexFlip}`;
          }
          if (gexMagnet != null) {
            panel.gexMagnetLine = candlestickSeries.createPriceLine({
              price: gexMagnet,
              color: '#fdd835',
              lineWidth: 1,
              lineStyle: LightweightCharts.LineStyle.Dotted,
              axisLabelVisible: true,
            });
            els.gexMagnetLabel.innerText = `Magnet: ${gexMagnet}`;
          }
          if (highArea != null) {
            panel.highAreaLine = candlestickSeries.createPriceLine({
              price: highArea,
              color: '#42a5f5',
              lineWidth: 2,
              lineStyle: LightweightCharts.LineStyle.Dashed,
              axisLabelVisible: true,
            });
            els.highAreaLabel.innerText = `High Area: ${highArea}`;
          }
          if (lowArea != null) {
            panel.lowAreaLine = candlestickSeries.createPriceLine({
              price: lowArea,
              color: '#42a5f5',
              lineWidth: 2,
              lineStyle: LightweightCharts.LineStyle.Dashed,
              axisLabelVisible: true,
            });
            els.lowAreaLabel.innerText = `Low Area: ${lowArea}`;
          }
          panel.positionWallLabels();
          panel.applyGexWallRegimeStyle();

          // Strike range for the overlay - Low Area to High Area, the
          // same range the two blue lines mark (now the ATM±7 window).
          let nearby = sortedStrikes;
          if (highArea != null && lowArea != null) {
            const lowIdx = sortedStrikes.indexOf(lowArea);
            const highIdx = sortedStrikes.indexOf(highArea);
            nearby = sortedStrikes.slice(lowIdx, highIdx + 1);
          }

          panel.strikeOverlayData = nearby.map((strike) => {
            const { c, p, cPct, pPct } = pctPair(strike);
            return { strike, c, p, cPct, pPct, isWallRow: strike === callWall || strike === putWall };
          });
          panel.gexStrikeData = nearby.map((strike) => ({
            strike,
            c: callGexByStrike.get(strike) || 0,
            p: putGexByStrike.get(strike) || 0,
            isWallRow: strike === gexCallWall || strike === gexPutWall,
          }));
          panel.positionStrikeOverlay();
          panel.positionGexOverlay();
          panel.positionCandleTimer();
          panel.positionSRLabels();
          panel.positionNetFlowLabels();
        } catch (err) {
          console.error(`[walls:${panel.symbol}] Failed to compute call/put walls:`, err);
          panel.strikeOverlayData = [];
          panel.gexStrikeData = [];
          els.strikeOverlayContainer.innerHTML = '';
          els.gexOverlayContainer.innerHTML = '';
        }
      };

      panel.watchFlow = function (expiration) {
        if (!expiration) return;
        panel.pendingWatchExpiration = expiration;
        panel.sendWS({ type: 'watch_flow', symbol: panel.symbol, expiration, spotPrice: panel.lastBarPrice });

        panel.refreshCallPutWalls(expiration);
        // Volume accumulates through the day - keep the walls current
        // instead of freezing them at whatever they were on first load.
        clearInterval(panel.wallRefreshTimer);
        panel.wallRefreshTimer = setInterval(() => panel.refreshCallPutWalls(expiration), 60_000);

        setTimeout(() => {
          if (panel.pendingWatchExpiration === expiration && panel.active && panel.symbol) {
            console.warn(`[flow:${panel.symbol}] No confirmation received for ${expiration} - retrying`);
            panel.sendWS({ type: 'watch_flow', symbol: panel.symbol, expiration, spotPrice: panel.lastBarPrice });
          }
        }, 5000);
      };

      panel.loadExpirationsDropdown = async function () {
        const select = els.expirationSelect;
        select.disabled = true;
        select.innerHTML = '<option value="">Loading...</option>';

        try {
          const dates = await fetchAllExpirations(panel.symbol);
          select.innerHTML = dates.map((d) => `<option value="${d}">${formatExpirationLabel(d)}</option>`).join('');
          select.disabled = false;
          panel.watchFlow(select.value);
        } catch (err) {
          console.error(`[flow:${panel.symbol}] Failed to load expirations:`, err);
          select.innerHTML = '<option value="">Failed to load</option>';
        }
      };

      panel.loadInitialSeedData = async function (symbol) {
        const previousSymbol = panel.symbol;
        panel.symbol = symbol;

        panel.sendWS({ type: 'unwatch_flow' });
        panel.pendingWatchExpiration = null;

        // Clear the previous ticker's wall lines/refresh timer - without
        // this they'd keep showing (and updating) on the new symbol's
        // chart, at price levels that belong to a completely different
        // underlying.
        clearInterval(panel.wallRefreshTimer);
        panel.strikeOverlayData = [];
        els.strikeOverlayContainer.innerHTML = '';
        panel.gexCallWallPrice = null;
        panel.gexPutWallPrice = null;
        els.gexCallWallLabel.style.display = 'none';
        els.gexPutWallLabel.style.display = 'none';
        panel.gexFlipPrice = null;
        els.gexFlipLabel.style.display = 'none';
        panel.gexMagnetPrice = null;
        els.gexMagnetLabel.style.display = 'none';
        panel.highAreaPrice = null;
        panel.lowAreaPrice = null;
        els.highAreaLabel.style.display = 'none';
        els.lowAreaLabel.style.display = 'none';
        panel.gexStrikeData = [];
        els.gexOverlayContainer.innerHTML = '';
        panel.netFlowByBarTime = new Map();
        els.netFlowContainer.innerHTML = '';

        els.tickerSymbol.innerText = symbol;
        els.tickerPrice.innerText = 'Loading...';
        els.flowList.innerHTML = '';
        panel.flowMarkers = [];
        candlestickSeries.setMarkers([]);
        panel.showChartError(null);
        if (!panel.hasLoadedOnce) panel.setStatus('Fetching price data...');

        let seedCandles;
        try {
          const result = await fetchHistoricalBars(symbol, panel.interval);
          seedCandles = result.bars;
          panel.previousClose = result.previousClose;
          console.log(`[chart:${symbol}] Loaded ${seedCandles.length} real bars`, seedCandles[seedCandles.length - 1]);
        } catch (err) {
          console.error(`[chart:${symbol}] Historical bars failed to load:`, err);
          panel.setStatus('Failed to load data', '#7a1f1f');
          panel.showChartError(`Couldn't load price history: ${err.message}`);
          els.tickerPrice.innerText = '--';
          els.tickerChange.innerText = '';
          candlestickSeries.setData([]);
          volumeSeries.setData([]);
          rsiSeries.setData([]);
          panel.updateMacd([]);
          panel.indicators.forEach((ind) => { ind.series.setData([]); ind.currentValue = null; });
          panel.closeHistory = [];
          panel.symbol = previousSymbol;
          return;
        }

        try {
          candlestickSeries.setData(seedCandles);
          volumeSeries.setData(seedCandles.map((b) => ({
            time: b.time,
            value: b.volume || 0,
            color: b.close >= b.open ? 'rgba(0, 200, 83, 0.5)' : 'rgba(255, 82, 82, 0.5)',
          })));
          panel.closeHistory = seedCandles.map((b) => ({ time: b.time, close: b.close }));
          rsiSeries.setData(computeRSI(seedCandles, RSI_PERIOD));
          panel.updateMacd(seedCandles);
          // Recompute whatever indicators the user has added, against
          // this (possibly new) symbol's fresh data - the user's chosen
          // set persists across ticker switches, just recalculated.
          panel.recomputeAllIndicators();
          panel.centerLastCandle();
          console.log(`[chart:${symbol}] setData succeeded, bars on chart:`, seedCandles.length);
        } catch (renderErr) {
          console.error(`[chart:${symbol}] setData threw:`, renderErr);
          panel.showChartError(`Chart failed to render candles: ${renderErr.message}`);
          return;
        }

        const last = seedCandles[seedCandles.length - 1];
        panel.lastBarTime = last.time;
        panel.lastBarPrice = last.close;
        panel.lastBarOpen = last.open;
        panel.currentBarHigh = last.high;
        panel.currentBarLow = last.low;
        panel.currentBarVolume = last.volume || 0;

        els.tickerPrice.innerText = `$${panel.lastBarPrice.toFixed(2)}`;
        els.tickerPrice.style.color = last.close >= last.open ? '#00c853' : '#ff5252';
        panel.updatePercentChange(panel.lastBarPrice);
        panel.positionCandleTimer();
        await panel.fetchSr15mBars(symbol);
        panel.computeAndDrawSupportResistance();
        panel.positionNetFlowLabels();
        panel.hasLoadedOnce = true;
        // TEMPORARY: Replay confirmed freezing the tab for stock tickers
        // (root cause not yet found - it works fine for futures, which
        // goes through a different code path). Disabled specifically for
        // stocks until that's fixed, rather than leave a broken button
        // live. Re-enable once addOptionFlowMarker's freeze is diagnosed.
        els.replayBtn.disabled = !isFuturesTicker(symbol);
        els.replayBtn.title = isFuturesTicker(symbol) ? '' : 'Temporarily unavailable for stocks - investigating a freezing issue';
        saveChartSettings(panel);

        panel.sendWS({ type: 'subscribe_price', symbol });

        if (isFuturesTicker(symbol)) {
          panel.setStatus('Live', '#1b5e20');
          els.expirationSelect.disabled = true;
          els.expirationSelect.innerHTML = '<option value="">N/A (futures)</option>';

          // Big Flow needs an options chain, which doesn't exist for
          // futures - without this, it silently errors in a loop (a
          // watch_big_flow request that can never succeed) every time a
          // futures ticker loads right after a stock (where Big Flow is
          // always on).
          if (panel.bigFlowEnabled) {
            panel.bigFlowEnabled = false;
            panel.sendWS({ type: 'unwatch_big_flow' });
          }
        } else {
          // Big Flow is always on for stocks now (no toggle) - re-point it
          // at the new ticker on every load. The server just overwrites
          // the same tracked-contracts entry, no separate unwatch needed.
          panel.bigFlowEnabled = true;
          panel.sendWS({ type: 'watch_big_flow', symbol, spotPrice: panel.lastBarPrice });
          panel.loadExpirationsDropdown();
        }
      };

      // Known futures roots (mirrors futuresHub.js's CONTRACT_MULTIPLIERS
      // keys) - typing just "NQ" resolves to whichever specific contract
      // is currently the active front month (e.g. "NQU6"), instead of
      // needing to know/type the exact expiration code.
      const FUTURES_ROOTS = new Set(['ES', 'NQ', 'YM', 'RTY', 'GC', 'CL', 'MES', 'MNQ', 'MYM', 'M2K', 'MGC', 'MCL']);

      async function resolveSymbolIfRoot(input) {
        if (!FUTURES_ROOTS.has(input)) return input;
        try {
          const res = await fetch(`${BACKEND_HTTP}/api/futures-resolve?root=${encodeURIComponent(input)}`);
          const data = await res.json();
          if (!res.ok || !data.ticker) throw new Error(data.error || 'Resolution failed');
          console.log(`[futures] Resolved ${input} -> ${data.ticker}`);
          return data.ticker;
        } catch (err) {
          console.error(`[futures] Failed to resolve root ${input}:`, err);
          panel.showChartError(`Couldn't resolve the current ${input} contract: ${err.message}`);
          return null;
        }
      }

      els.searchBtn.addEventListener('click', async () => {
        const rawSymbol = els.tickerInput.value.trim().toUpperCase();
        if (!rawSymbol) return;
        const symbol = await resolveSymbolIfRoot(rawSymbol);
        if (symbol && symbol !== panel.symbol) panel.loadInitialSeedData(symbol);
      });

      els.replayBtn.addEventListener('click', async () => {
        const symbol = panel.symbol;
        const originalLabel = els.replayBtn.innerText;
        els.replayBtn.disabled = true;
        els.replayBtn.innerText = 'Loading...';

        try {
          const res = await fetch(`${BACKEND_HTTP}/api/flow-history?symbol=${encodeURIComponent(symbol)}`);
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || `Request failed: ${res.status}`);

          // Start from a clean slate rather than appending - anything that
          // streamed in live while this tab was open is ALSO in history
          // now, so appending would duplicate it. Replay fully replaces
          // the flow view with the saved, complete picture for today.
          els.flowList.innerHTML = '';
          panel.flowMarkers = [];
          candlestickSeries.setMarkers([]);
          panel.netFlowByBarTime = new Map();
          els.netFlowContainer.innerHTML = '';
          panel.pendingSidebarCards = [];

          for (const event of data.events || []) {
            if (event.assetType === 'option') {
              panel.addOptionFlowMarker(event.optionType, event.strike, event.value, event.timeMs, event.side, formatExpirationLabel(event.expiration), true, true);
            } else {
              // 'stock' and 'futures' share the same marker/card shape -
              // size doubles as standardEquivalentSize for futures (see
              // addStockFlowMarker: it's only actually used for the
              // isFutures display branch, ignored otherwise).
              panel.addStockFlowMarker(event.size, event.value, event.timeMs, event.side, event.sourceSymbol, event.size, true, true);
            }
          }

          // The loop above deferred the chart-marker redraw, the net-flow
          // label rebuild, AND every sidebar card's DOM insertion on every
          // individual event (deferRender=true) - hundreds of saved
          // events (very plausible now that the ES/NQ/GC background watch
          // runs continuously) meant hundreds of unbatched DOM operations,
          // visibly freezing the tab even after the marker/net-flow
          // redraws alone were fixed. Do all three exactly once now.
          candlestickSeries.setMarkers(panel.flowMarkers);
          panel.positionNetFlowLabels();
          if (panel.pendingSidebarCards.length > 0) {
            const fragment = document.createDocumentFragment();
            // Cards were buffered oldest-to-newest (the loop's own order).
            // Insert in reverse so the most recent ends up first/top,
            // matching what individual prepend() calls would have
            // produced.
            for (let i = panel.pendingSidebarCards.length - 1; i >= 0; i--) {
              fragment.appendChild(panel.pendingSidebarCards[i]);
            }
            els.flowList.appendChild(fragment); // flowList was already cleared above, so this is its only content
            panel.pendingSidebarCards = [];
          }

          if (!data.events || data.events.length === 0) {
            els.flowList.innerHTML = '<div style="padding: 8px; color: #8fa0be; font-size: 12px;">No saved flow for today yet</div>';
          }
        } catch (err) {
          console.error(`[replay:${symbol}] failed:`, err);
          els.flowList.innerHTML = '<div style="padding: 8px; color: #ff5252; font-size: 12px;">Failed to load flow history</div>';
        } finally {
          els.replayBtn.disabled = false;
          els.replayBtn.innerText = originalLabel;
        }
      });

      els.tickerInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') els.searchBtn.click();
      });
      els.timeframeSelect.addEventListener('change', (e) => {
        panel.interval = e.target.value;
        panel.intervalSeconds = INTERVAL_SECONDS[panel.interval] || 60;
        // Full reload at the new timeframe - same symbol, but candles,
        // MAs, volume, and live-tick bucketing all need to reset to match.
        panel.loadInitialSeedData(panel.symbol);
        saveChartSettings(panel);
      });
      els.expirationSelect.addEventListener('change', (e) => {
        els.flowList.innerHTML = '';
        panel.flowMarkers = [];
        candlestickSeries.setMarkers([]);
        panel.watchFlow(e.target.value);
      });

      panel.clampIndicatorPanelPosition = function () {
        els.indicatorPanel.style.transform = 'translateX(-50%)';
        const margin = 8;
        const rect = els.indicatorPanel.getBoundingClientRect();
        let shift = 0;
        if (rect.left < margin) shift = margin - rect.left;
        else if (rect.right > window.innerWidth - margin) shift = (window.innerWidth - margin) - rect.right;
        if (shift !== 0) els.indicatorPanel.style.transform = `translateX(calc(-50% + ${shift}px))`;
      };

      els.indicatorToggleBtn.addEventListener('click', () => {
        const opening = els.indicatorPanel.classList.contains('hidden');
        els.indicatorPanel.classList.toggle('hidden');
        els.indicatorToggleBtn.classList.toggle('active', opening);
        // On a narrow (phone) screen the centered panel can extend past
        // the left or right edge of the viewport and become unreachable -
        // nudge it back on-screen with a horizontal offset if it does.
        if (opening) panel.clampIndicatorPanelPosition();
      });

      els.srToggleCheckbox.addEventListener('change', () => {
        panel.srEnabled = els.srToggleCheckbox.checked;
        panel.computeAndDrawSupportResistance();
        saveChartSettings(panel);
      });

      els.volumeProfileToggleCheckbox.addEventListener('change', () => {
        panel.volumeProfileEnabled = els.volumeProfileToggleCheckbox.checked;
        panel.positionStrikeOverlay();
        saveChartSettings(panel);
      });

      els.gexToggleCheckbox.addEventListener('change', () => {
        panel.gexEnabled = els.gexToggleCheckbox.checked;
        if (!panel.gexEnabled) {
          // The bar overlay already self-clears inside positionGexOverlay
          // when disabled, but the wall price LINES don't - they're only
          // ever drawn/removed inside refreshCallPutWalls, so turning the
          // toggle off has to explicitly tear them down here too.
          if (panel.gexCallWallLine) { candlestickSeries.removePriceLine(panel.gexCallWallLine); panel.gexCallWallLine = null; }
          if (panel.gexPutWallLine) { candlestickSeries.removePriceLine(panel.gexPutWallLine); panel.gexPutWallLine = null; }
          if (panel.gexFlipLine) { candlestickSeries.removePriceLine(panel.gexFlipLine); panel.gexFlipLine = null; }
          if (panel.gexMagnetLine) { candlestickSeries.removePriceLine(panel.gexMagnetLine); panel.gexMagnetLine = null; }
          panel.gexCallWallPrice = null;
          panel.gexPutWallPrice = null;
          panel.gexFlipPrice = null;
          panel.gexMagnetPrice = null;
          els.gexCallWallLabel.style.display = 'none';
          els.gexPutWallLabel.style.display = 'none';
          els.gexFlipLabel.style.display = 'none';
          els.gexMagnetLabel.style.display = 'none';
          panel.gexStrikeData = [];
        } else if (els.expirationSelect.value) {
          // Re-fetch and redraw fresh rather than trying to resurrect
          // stale data - simplest way to get the lines back correctly.
          panel.refreshCallPutWalls(els.expirationSelect.value);
        }
        panel.positionGexOverlay();
        saveChartSettings(panel);
      });

      els.macdToggleCheckbox.addEventListener('change', () => {
        panel.macdEnabled = els.macdToggleCheckbox.checked;
        panel.updateMacd(panel.closeHistory);
        saveChartSettings(panel);
      });

      els.indicatorAddBtn.addEventListener('click', () => {
        const type = els.indicatorTypeSelect.value;
        const period = parseInt(els.indicatorPeriodInput.value, 10);
        if (!period || period < 1) return;

        // "Step" is a different Lightweight Charts property (lineType)
        // than the dash pattern options (lineStyle) - map the single
        // dropdown choice to whichever combination it actually needs.
        const STYLE_MAP = {
          solid: { lineStyle: 0, lineType: 0 },
          dashed: { lineStyle: 2, lineType: 0 },
          dotted: { lineStyle: 1, lineType: 0 },
          step: { lineStyle: 0, lineType: 1 },
        };
        const { lineStyle, lineType } = STYLE_MAP[els.indicatorStyleSelect.value] || STYLE_MAP.solid;

        panel.addIndicator(type, period, lineStyle, lineType);
      });

      // Remove buttons are created dynamically inside the list's
      // innerHTML, so a single delegated listener on the list container
      // catches clicks on any of them, present or future.
      els.indicatorList.addEventListener('click', (e) => {
        const btn = e.target.closest('.indicator-remove-btn');
        if (btn) panel.removeIndicator(btn.dataset.id);
      });

      window.addEventListener('resize', () => {
        panel.centerLastCandle();
        panel.positionWallLabels();
        panel.positionStrikeOverlay();
        panel.positionGexOverlay();
        panel.positionCandleTimer();
        panel.positionSRLabels();
        panel.positionNetFlowLabels();
        if (!els.indicatorPanel.classList.contains('hidden')) panel.clampIndicatorPanelPosition();
      });

      // Keeps the candle countdown ticking even during quiet stretches
      // with no live trades - everything else here is only repositioned
      // in response to a price tick, resize, or pan/zoom, but the
      // countdown needs to advance once a second regardless.
      setInterval(() => panel.positionCandleTimer(), 1000);

      // Panning/zooming the chart shifts the auto-scaled price range (and
      // therefore the price->pixel mapping) just as much as a live tick
      // does - without this, the labels only caught up on the next tick
      // or 60s refresh, visibly lagging behind the actual line while
      // the user was actively scrolling/zooming.
      chart.timeScale().subscribeVisibleLogicalRangeChange(() => { panel.positionWallLabels(); panel.positionStrikeOverlay(); panel.positionGexOverlay(); panel.positionCandleTimer(); panel.positionSRLabels(); panel.positionNetFlowLabels(); });

      return panel;
    }

    function initApp() {
    const panels = [
      createPanel(0, 'SPY'),
      createPanel(1, 'QQQ'),
    ];

    panels.forEach(async (p) => {
      await p.loadInitialSeedData(p.symbol);
      for (const ind of p.pendingIndicatorRestore) {
        p.addIndicator(ind.type, ind.period, ind.lineStyle, ind.lineType);
      }
    });

    document.getElementById('layout-select').addEventListener('change', (e) => {
      const mode = e.target.value;
      const secondPanelRoot = document.querySelector('[data-panel-index="1"]');

      if (mode === '1') {
        secondPanelRoot.classList.add('hidden');
        panels[1].pause();
      } else {
        secondPanelRoot.classList.remove('hidden');
        panels[1].resume();
      }

      requestAnimationFrame(() => {
        panels[0].centerLastCandle();
        if (mode === '2') panels[1].centerLastCandle();
      });
    });

    document.getElementById('marker-floor-select').addEventListener('change', (e) => {
      CHART_MARKER_PREMIUM_FLOOR = parseInt(e.target.value, 10);
    });

    document.getElementById('futures-marker-floor-select').addEventListener('change', (e) => {
      FUTURES_CHART_MARKER_FLOOR = parseInt(e.target.value, 10);
      localStorage.setItem('xnlflow:futuresMarkerFloor', FUTURES_CHART_MARKER_FLOOR);
    });
    // Reflect whatever was actually loaded (a previously-saved value, or
    // the $4M default) in the dropdown itself - the HTML's own "selected"
    // attribute only covers the very first visit, before anything's ever
    // been saved.
    document.getElementById('futures-marker-floor-select').value = FUTURES_CHART_MARKER_FLOOR;

    function formatPremiumTotal(n) {
      if (n >= 1_000_000) return `$${(n / 1_000_000).toFixed(2)}M`;
      return `$${(n / 1000).toFixed(0)}k`;
    }

    function leaderboardItemHtml(entry, rank) {
      const putHeavy = entry.put > entry.call;
      const pct = entry.percentChange;
      // Always rendered (even empty) - its flex:1 is what keeps Call/Put
      // right-aligned consistently, whether or not this symbol has a
      // percent change value available.
      const pctText = pct != null ? `${pct >= 0 ? '+' : ''}${pct.toFixed(2)}%` : '';
      const pctColor = pct != null ? (pct >= 0 ? '#00c853' : '#ff5252') : 'transparent';
      return `<div class="leaderboard-item" data-symbol="${entry.symbol}">` +
        `<span class="leaderboard-rank">${rank}</span>` +
        `<span class="leaderboard-symbol ${putHeavy ? 'put-heavy' : 'call-heavy'}">${entry.symbol}</span>` +
        `<span class="leaderboard-pct" style="color: ${pctColor};">${pctText}</span>` +
        `<span class="leaderboard-call">${formatPremiumTotal(entry.call)}</span>` +
        `<span class="leaderboard-put">${formatPremiumTotal(entry.put)}</span>` +
        `</div>`;
    }

    // Same MAJOR/OTHER threshold pattern Big Flow already uses (server
    // sends every matching trade with no filtering - see tradierHub.js -
    // so the "is this actually big enough to show" decision happens here,
    // client-side, same as everywhere else in this app).
    const BACKGROUND_FLOW_THRESHOLD_MAJOR = 250_000;
    const BACKGROUND_FLOW_THRESHOLD_OTHER = 150_000;
    const BACKGROUND_FLOW_MAJOR_SYMBOLS = new Set(['SPY', 'QQQ', 'IWM']);
    const BACKGROUND_FLOW_LIST_MAX = 100; // higher than the per-ticker sidebar's 60 - this list covers 15 tickers at once, so it fills faster

    function renderBackgroundFlowEntry(event) {
      const threshold = BACKGROUND_FLOW_MAJOR_SYMBOLS.has(event.symbol) ? BACKGROUND_FLOW_THRESHOLD_MAJOR : BACKGROUND_FLOW_THRESHOLD_OTHER;
      if (event.premium < threshold) return;

      const listEl = document.getElementById('background-flow-list');
      const isCall = event.optionType === 'CALL';
      const formattedPrem = `$${(event.premium / 1000).toFixed(0)}k`;
      const timeStr = formatTradeTime(event.timeMs);
      const card = document.createElement('div');
      card.className = `flow-card ${isCall ? 'call' : 'put'}`;
      card.innerHTML = `
        <div class="flow-details">
          <span class="flow-strike"><span class="background-flow-ticker">${event.symbol}</span>${event.strike} ${event.optionType}</span>
          <span style="color: #8fa0be; font-size: 10px;">${event.side || 'BOUGHT'} &middot; ${timeStr}</span>
        </div>
        <span class="flow-premium">${formattedPrem}</span>
      `;
      listEl.prepend(card);
      while (listEl.children.length > BACKGROUND_FLOW_LIST_MAX) listEl.removeChild(listEl.lastChild);
    }

    async function loadLeaderboard() {
      const listEl = document.getElementById('leaderboard-list');
      listEl.innerText = 'Loading...';

      try {
        const res = await fetch(`${BACKEND_HTTP}/api/premium-leaderboard`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || `Request failed: ${res.status}`);

        if (!data.ready) {
          listEl.innerText = 'Still setting up - try again in a moment';
          return;
        }

        const rankings = data.rankings || [];
        listEl.innerHTML = rankings.length
          ? rankings.slice(0, 15).map((entry, i) => leaderboardItemHtml(entry, i + 1)).join('')
          : 'No premium tracked yet today';
      } catch (err) {
        console.error('[leaderboard] failed to load:', err);
        listEl.innerText = 'Failed to load';
      }
    }

    let leaderboardPollInterval = null;

    function stopLeaderboardPolling() {
      clearInterval(leaderboardPollInterval);
      leaderboardPollInterval = null;
    }

    document.getElementById('leaderboard-btn').addEventListener('click', () => {
      const panel = document.getElementById('leaderboard-panel');
      const opening = panel.classList.contains('hidden');
      panel.classList.toggle('hidden');
      if (opening) {
        loadLeaderboard();
        // Refresh every 30s while the panel stays open - underlying
        // premium totals update live on the backend as trades stream in,
        // this just keeps what's on screen from going stale without
        // requiring a manual close/reopen. Stopped the moment the panel
        // closes, so it's never polling in the background for no reason.
        stopLeaderboardPolling();
        leaderboardPollInterval = setInterval(loadLeaderboard, 30_000);
      } else {
        stopLeaderboardPolling();
      }
    });

    // Background Flow needs no polling (unlike the leaderboard above) -
    // entries arrive pushed over the WebSocket in real time and keep
    // accumulating in the list regardless of whether the panel is open;
    // this button just shows/hides what's already there.
    document.getElementById('background-flow-btn').addEventListener('click', () => {
      document.getElementById('background-flow-panel').classList.toggle('hidden');
    });

    document.getElementById('leaderboard-panel').addEventListener('click', (e) => {
      const item = e.target.closest('.leaderboard-item');
      if (!item || !item.dataset.symbol) return;
      const symbol = item.dataset.symbol;
      panels[0].els.tickerInput.value = symbol;
      panels[0].loadInitialSeedData(symbol);
      document.getElementById('leaderboard-panel').classList.add('hidden');
      stopLeaderboardPolling();
    });

    } // end initApp

    initApp();
  </script>
</body>
</html>
