<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Option Flow</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #0b0e14;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
    }

    .global-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 12px;
      background-color: #0b0e14;
      border-bottom: 1px solid #1f293d;
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .global-bar select {
      background-color: #1f293d;
      color: #ffffff;
      border: 1px solid #364153;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }

    .global-bar {
      position: relative; /* anchor for the leaderboard dropdown */
    }

    .leaderboard-btn {
      background-color: #2b3548;
      color: #ffffff;
      border: 1px solid #364153;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }

    .leaderboard-btn:hover {
      background-color: #364153;
    }

    .leaderboard-panel {
      position: absolute;
      top: 44px;
      left: 12px;
      z-index: 50;
      background-color: #131822;
      border: 1px solid #1f293d;
      border-radius: 8px;
      padding: 12px;
      min-width: 260px;
      max-height: 340px;
      overflow-y: auto;
    }

    .leaderboard-panel.hidden {
      display: none;
    }

    #background-flow-panel {
      min-width: 320px;
      max-width: 380px;
    }

    #background-flow-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 8px;
    }

    #background-flow-list .flow-card {
      font-size: 10px; /* smaller than the sidebar's flow-card - this list carries a ticker per entry too, more to fit */
    }

    .background-flow-ticker {
      font-weight: 700;
      color: #8fa0be;
      margin-right: 4px;
    }

    .leaderboard-panel h4 {
      margin: 0 0 6px 0;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #8fa0be;
    }

    .leaderboard-header {
      display: flex;
      align-items: baseline;
      gap: 10px;
      padding: 0 6px 4px 6px;
      margin-bottom: 4px;
      border-bottom: 1px solid #1f293d;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .leaderboard-item {
      display: flex;
      align-items: baseline;
      gap: 10px;
      padding: 5px 6px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }

    .leaderboard-item:hover {
      background-color: #1f293d;
    }

    .leaderboard-rank {
      color: #8fa0be;
      font-size: 11px;
      width: 16px;
      flex-shrink: 0;
    }

    .leaderboard-symbol {
      font-weight: 600;
    }

    .leaderboard-symbol.call-heavy { color: #00c853; }
    .leaderboard-symbol.put-heavy { color: #ff5252; }

    .leaderboard-pct {
      flex: 1;
      font-size: 11px;
      font-weight: 600;
    }

    .leaderboard-call {
      color: #00c853;
      font-size: 12px;
      min-width: 46px;
      text-align: right;
    }

    .leaderboard-put {
      color: #ff5252;
      font-size: 12px;
      min-width: 46px;
      text-align: right;
    }

    .panels-row {
      display: flex;
      flex-direction: row;
      flex: 1;
      overflow: hidden;
    }

    .panel {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      border-right: 1px solid #1f293d;
    }

    .panel.hidden {
      display: none;
    }

    .panel:last-child {
      border-right: none;
    }

    .toolbar {
      position: relative; /* positioning context for toolbar children if needed */
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      background-color: #0b0e14;
      border-bottom: 1px solid #1f293d;
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .toolbar label {
      font-size: 13px;
    }

    .toolbar input {
      background-color: #1f293d;
      color: #ffffff;
      border: 1px solid #364153;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      text-transform: uppercase;
      width: 90px;
    }

    .toolbar button {
      background-color: #2b3548;
      color: #ffffff;
      border: 1px solid #364153;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }

    .toolbar button:hover {
      background-color: #364153;
    }

    .toolbar button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .toolbar button:disabled:hover {
      background-color: #2b3548; /* cancel the normal hover color change while disabled */
    }

    .toolbar select {
      background-color: #1f293d;
      color: #ffffff;
      border: 1px solid #364153;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      max-width: 150px;
    }

    .toolbar select:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .main-layout {
      display: flex;
      flex: 1;
      width: 100%;
      overflow: hidden;
    }

    .chart-wrapper {
      position: relative;
      flex: 1;
      min-height: 300px;
      min-width: 200px;
      overflow: hidden;
    }

    .chart-watermark {
      position: absolute;
      bottom: 4px;
      right: 8px;
      z-index: 3;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: rgba(209, 212, 220, 0.35);
      pointer-events: none;
      user-select: none;
    }

    .chart-error-banner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 20;
      background-color: #2b1414;
      border: 1px solid #7a1f1f;
      color: #ffb4b4;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 13px;
      max-width: 85%;
      text-align: center;
      display: none;
    }

    .chart-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .ticker-overlay {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 10;
      display: flex;
      align-items: baseline;
      gap: 10px;
      pointer-events: none;
    }

    .ticker-symbol {
      font-size: 18px;
      font-weight: bold;
    }

    .ticker-price {
      font-size: 15px;
      color: #00c853;
    }

    .ticker-change {
      font-size: 13px;
      font-weight: 600;
    }

    .ws-debug {
      font-size: 10px;
      color: #8fa0be;
      font-family: monospace;
    }

    .status-badge {
      font-size: 11px;
      padding: 3px 7px;
      border-radius: 4px;
      background-color: #2b3548;
      color: #8fa0be;
    }

    .flow-panel {
      width: 190px;
      flex-shrink: 0;
      background-color: #131822;
      border-left: 1px solid #1f293d;
      padding: 10px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }

    .flow-title {
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 8px;
      color: #8fa0be;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      flex-shrink: 0;
    }

    /* Narrow screens (phones): side-by-side layouts don't fit without
       clipping content, so stack everything vertically instead. */
    @media (max-width: 700px) {
      .panels-row {
        flex-direction: column;
        overflow-y: auto;
        overflow-x: hidden;
      }

      .panel {
        border-right: none;
        border-bottom: 1px solid #1f293d;
        flex: none; /* let each panel take its natural stacked height, not fight for equal split */
      }

      .main-layout {
        flex-direction: column;
      }

      .chart-wrapper {
        min-height: 480px; /* room for 4 stacked panes (price, volume, RSI, MACD) without cramping any of them */
        min-width: 0;
      }

      .flow-panel {
        width: 100%;
        height: 160px;
        border-left: none;
        border-top: 1px solid #1f293d;
        margin-top: 14px;
      }
    }

    .flow-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .flow-card {
      background-color: #1a2232;
      padding: 6px 8px;
      border-radius: 6px;
      border-left: 4px solid #8fa0be;
      font-size: 11px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .flow-card.call { border-left-color: #00c853; }
    .flow-card.put { border-left-color: #ff5252; }

    .flow-details {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .flow-strike { font-weight: bold; color: #ffffff; }
    .flow-premium { color: #00c853; font-weight: 600; }
    .flow-card.put .flow-premium { color: #ff5252; }

    .indicator-toggle-btn {
      background-color: #2b3548;
      color: #ffffff;
      border: 1px solid #364153;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }

    .indicator-toggle-btn:hover {
      background-color: #364153;
    }

    .indicator-toggle-btn.active {
      background-color: #7a5f00;
      border-color: #a68100;
    }

    .indicator-wrap {
      position: relative;
      display: inline-block;
    }

    .indicator-panel {
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      margin-top: 6px;
      z-index: 50;
      background-color: #131822;
      border: 1px solid #1f293d;
      border-radius: 8px;
      padding: 10px;
      min-width: 220px;
      max-width: calc(100vw - 16px);
      box-sizing: border-box;
    }

    .indicator-panel.hidden {
      display: none;
    }

    .indicator-add-row {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }

    .sr-toggle-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #d1d4dc;
      padding-bottom: 8px;
      margin-bottom: 8px;
      border-bottom: 1px solid #1f293d;
      cursor: pointer;
    }

    .indicator-type-select {
      background-color: #1f293d;
      color: #ffffff;
      border: 1px solid #364153;
      border-radius: 4px;
      font-size: 12px;
      padding: 4px;
    }

    .indicator-period-input {
      background-color: #1f293d;
      color: #ffffff;
      border: 1px solid #364153;
      border-radius: 4px;
      font-size: 12px;
      padding: 4px;
      width: 50px;
    }

    .indicator-add-btn {
      background-color: #2b3548;
      color: #ffffff;
      border: 1px solid #364153;
      border-radius: 4px;
      font-size: 12px;
      padding: 4px 8px;
      cursor: pointer;
    }

    .indicator-add-btn:hover {
      background-color: #364153;
    }

    .indicator-list-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 2px;
      font-size: 12px;
    }

    .indicator-swatch {
      width: 10px;
      height: 10px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    .indicator-list-label {
      flex: 1;
    }

    .indicator-remove-btn {
      background: none;
      border: none;
      color: #8fa0be;
      cursor: pointer;
      font-size: 14px;
      padding: 0 4px;
    }

    .indicator-remove-btn:hover {
      color: #ff5252;
    }

    /* Big-flow entries (any expiration, not just the selected one) get a
       distinct gold border and an expiration-date line, so they're never
       confused with the normal single-expiration sidebar entries. */
    .flow-card.bigflow {
      border-left-color: #ffc107;
    }

    .flow-bigflow-tag {
      color: #ffc107;
      font-weight: 700;
      font-size: 10px;
      letter-spacing: 0.3px;
    }

    /* Stock share flow (large trades on the underlying, not options) -
       purple, distinct from option flow's green/red and big-flow's gold. */
    .flow-card.stockflow {
      border-left-color: #9c27b0;
    }

    .flow-stockflow-tag {
      color: #9c27b0;
      font-weight: 700;
      font-size: 10px;
      letter-spacing: 0.3px;
    }

    /* Always-visible on-chart per-strike overlay - one absolutely
       positioned row per strike, right-anchored near the price axis,
       vertically placed at that strike's actual price level. Replaces
       the old click-to-open "Vol by Strike" dropdown panel. */
    .strike-overlay-container {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      z-index: 12;
    }

    .strike-overlay-row {
      position: absolute;
      right: 62px; /* clears the native price axis labels */
      transform: translateY(-50%);
      display: flex;
      flex-direction: row-reverse; /* bar-track (closest to axis) first visually, strike number trails leftward - matches how volume profile bars anchor to one edge */
      align-items: center;
      font-size: 10px;
      white-space: nowrap;
    }

    .strike-overlay-row.wall-row {
      font-weight: 700;
    }

    .strike-overlay-strike {
      width: 28px;
      text-align: right;
      color: #d1d4dc;
      margin-right: 6px;
    }

    .strike-overlay-bar-track {
      position: relative; /* anchor for the overlapping text below */
      width: 150px;
      height: 14px;
    }

    .strike-overlay-bar-fill {
      height: 100%;
      display: flex;
      border-radius: 2px;
      overflow: hidden;
      min-width: 2px; /* so a strike with tiny volume still shows a sliver, not nothing */
      margin-left: auto; /* anchors the fill's right edge to the track's right edge - grows leftward with volume, like a real volume profile */
    }

    .strike-overlay-bar-call { height: 100%; background-color: #00c853; }
    .strike-overlay-bar-put { height: 100%; background-color: #ff5252; }

    .strike-overlay-text {
      position: absolute;
      top: 50%;
      right: 4px;
      transform: translateY(-50%);
      color: #ffffff;
      text-shadow: 0 0 3px #000000, 0 0 3px #000000; /* keeps text legible over both the green and red bar segments */
      z-index: 1;
    }

    .strike-overlay-call-pct { color: #ffffff; }
    .strike-overlay-put-pct { color: #ffffff; }

    /* GEX overlay reuses all the structural strike-overlay-* classes
       above, just in its own container positioned further left - so if
       both this and the volume profile are toggled on at once (the
       whole point: comparing them), they render as two side-by-side
       columns instead of overlapping illegibly. Distinct orange/cyan
       color scheme keeps them visually unambiguous even when crowded. */
    .gex-overlay-row {
      right: 250px;
    }

    .gex-overlay-row .strike-overlay-bar-track {
      width: 90px; /* narrower than the volume lane's 150px - keeps both lanes fitting comfortably together on narrower panels */
    }

    .gex-overlay-row .strike-overlay-bar-call { background-color: #ffa726; }
    .gex-overlay-row .strike-overlay-bar-put { background-color: #29b6f6; }

    .wall-label.gex-call-wall-label {
      background-color: transparent;
      color: #ffa726;
    }

    .wall-label.gex-put-wall-label {
      background-color: transparent;
      color: #29b6f6;
    }

    /* Applied when current price sits below the Gamma Flip line - see
       panel.applyGexWallRegimeStyle. Dims the label to visually match the
       line itself going thinner/dotted, so a wall reads as structurally
       less reliable in the current regime without needing separate text. */
    .wall-label.gex-call-wall-label.weak,
    .wall-label.gex-put-wall-label.weak {
      opacity: 0.45;
    }

    .wall-label.gex-flip-label {
      background-color: transparent;
      color: #e0e0e0;
    }

    .wall-label.high-area-label,
    .wall-label.low-area-label {
      left: 9%; /* own lane, left of Magnet (12%), S/R (25%), and GEX Call/Put Wall/Flip (center) - nudged right from 5% so it isn't clipped by the window edge */
      background-color: transparent;
      color: #42a5f5;
    }

    .wall-label.gex-magnet-label {
      left: 12%; /* own lane, clear of High/Low Area (9%), S/R (25%), and GEX Call/Put Wall/Flip (center) */
      background-color: transparent;
      color: #fdd835;
    }

    /* End-of-line MA labels - positioned at the line's current value and
       the latest bar's x-position, instead of Lightweight Charts' native
       label (which only renders in the fixed price-axis column). */
    .wall-label {
      position: absolute;
      left: 50%;
      transform: translate(-50%, -100%);
      z-index: 15;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      pointer-events: none;
    }

    .wall-label.below-line {
      transform: translate(-50%, 4px); /* flips to sit below the line instead of above, used when Call Wall and Put Wall share the same strike */
    }

    .sr-label {
      position: absolute;
      left: 25%; /* kept out of the right half, where the right-anchored strike/volume-profile overlay sits on stock charts */
      transform: translate(-50%, -100%);
      z-index: 14;
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      pointer-events: none;
    }

    .sr-label.resistance-label {
      color: #ff5252;
    }

    .sr-label.support-label {
      color: #00c853;
    }

    .net-flow-label {
      position: absolute;
      transform: translate(-50%, -100%);
      z-index: 13;
      font-size: 13px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      pointer-events: none;
      background-color: #ffffff;
      padding: 1px 4px;
      border-radius: 3px;
    }

    .net-flow-label.below {
      transform: translate(-50%, 4px); /* anchors from the top instead of bottom, so it sits below its point rather than above */
    }

    .candle-timer {
      position: absolute;
      right: 0;
      z-index: 15;
      padding: 1px 8px;
      border-radius: 0 0 3px 3px; /* only bottom corners rounded, so the top edge sits flush against the native price label above it */
      font-size: 10px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      text-align: center;
      pointer-events: none;
      color: #ffffff;
      display: none;
    }
  </style>

  <!-- Lightweight Charts v4 Standalone -->
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>

  <div class="global-bar">
    <label><strong>Layout:</strong></label>
    <select id="layout-select">
      <option value="2">2 Windows</option>
      <option value="1">1 Window</option>
    </select>

    <label><strong>Stock - Min On Chart:</strong></label>
    <select id="marker-floor-select">
      <option value="0">Show all</option>
      <option value="10000">$10k+</option>
      <option value="25000">$25k+</option>
      <option value="50000" selected>$50k+</option>
      <option value="100000">$100k+</option>
      <option value="250000">$250k+</option>
      <option value="500000">$500k+</option>
      <option value="1000000">$1M+</option>
    </select>

    <label><strong>Future - Min On Chart:</strong></label>
    <select id="futures-marker-floor-select">
      <option value="2000000">$2M+</option>
      <option value="4000000" selected>$4M+</option>
      <option value="6000000">$6M+</option>
      <option value="8000000">$8M+</option>
      <option value="10000000">$10M+</option>
    </select>

    <button id="leaderboard-btn" class="leaderboard-btn">Top Premium</button>
    <div id="leaderboard-panel" class="leaderboard-panel hidden">
      <h4>Top Option Premium Today</h4>
      <div class="leaderboard-header">
        <span class="leaderboard-rank"></span>
        <span class="leaderboard-symbol"></span>
        <span class="leaderboard-call">Calls</span>
        <span class="leaderboard-put">Puts</span>
      </div>
      <div id="leaderboard-list">Loading...</div>
    </div>

    <!-- TEMPORARILY HIDDEN alongside server.js's disabled initBackgroundFlow() call - showing this button with no backend watcher running would just open a permanently-empty panel. Remove style="display:none;" when re-enabling. -->
    <button id="background-flow-btn" class="leaderboard-btn" style="display:none;">Background Flow</button>
    <div id="background-flow-panel" class="leaderboard-panel hidden">
      <h4>Background Flow - SPY, QQQ, IWM, AAPL, MSFT, NVDA, AMZN, GOOGL, META, TSLA, AMD, NFLX, AVGO, COIN, PLTR</h4>
      <div id="background-flow-list"></div>
    </div>
  </div>

  <div class="panels-row">

  <div class="panel" data-panel-index="0">
    <div class="toolbar">
      <label><strong>Ticker:</strong></label>
      <input type="text" class="ticker-input" value="SPY" placeholder="e.g. AMD" />
      <button class="search-btn">Load Chart</button>
      <button class="replay-btn">Replay</button>
      <label><strong>TF:</strong></label>
      <select class="timeframe-select">
        <option value="1min" selected>1m</option>
        <option value="5min">5m</option>
        <option value="15min">15m</option>
        <option value="30min">30m</option>
        <option value="1h">1H</option>
        <option value="1day">1D</option>
      </select>
      <div class="indicator-wrap">
        <button class="indicator-toggle-btn">Indicators</button>
        <div class="indicator-panel hidden">
          <label class="sr-toggle-row">
            <input type="checkbox" class="sr-toggle-checkbox" checked />
            Support/Resistance
          </label>
          <label class="sr-toggle-row">
            <input type="checkbox" class="volume-profile-toggle-checkbox" checked />
            Option Volume (stock only)
          </label>
          <label class="sr-toggle-row">
            <input type="checkbox" class="macd-toggle-checkbox" checked />
            MACD
          </label>
          <label class="sr-toggle-row">
            <input type="checkbox" class="gex-toggle-checkbox" checked />
            Gamma Exposure (GEX)
          </label>
          <div class="indicator-add-row">
            <select class="indicator-type-select">
              <option value="MA">MA</option>
              <option value="EMA">EMA</option>

  <script>
    const BACKEND_HTTP = window.location.origin;
    const BACKEND_WS = `${window.location.protocol === 'https:' ? 'wss:' : 'ws:'}//${window.location.host}/ws`;

    const MIN_FLOW_PREMIUM = 25000;
    let CHART_MARKER_PREMIUM_FLOOR = 50000;
    let FUTURES_CHART_MARKER_FLOOR = parseInt(localStorage.getItem('xnlflow:futuresMarkerFloor'), 10) || 4_000_000; // separate, higher floor for futures large-trade chart markers - server still detects/broadcasts at its own $3M threshold, this only controls what gets a chart arrow. Persisted locally (this is a global setting, not per-panel, unlike the ticker/timeframe/indicator settings) so the choice survives reloads.
    const CHART_MARKER_MAX = 60;
    const SIDEBAR_FLOW_MAX = 60;
    const MARKER_SIZE = 1; // larger = bigger arrow + further from the candle body (single control, linked together)
    const BIG_FLOW_THRESHOLD_MAJOR = 250000; // SPY/QQQ - deep enough liquidity that $250k+ single prints happen regularly, still a meaningful "genuinely large" bar
    const BIG_FLOW_THRESHOLD_OTHER = 150000; // everything else - thinner chains mean a $250k single print is comparatively rare, so this stays lower to actually surface activity
    const BIG_FLOW_MAJOR_SYMBOLS = new Set(['SPY', 'QQQ']);
    const INTERVAL_SECONDS = { '1min': 60, '5min': 300, '15min': 900, '30min': 1800, '1h': 3600, '1day': 86400 };

    // Support/resistance: swing-high/low ("fractal") clustering, computed
    // from a FIXED 15-minute bar series maintained independently of
    // whatever timeframe the chart is actually displaying - so levels
    // stay stable (based on real 15m structure) rather than jumping
    // around every time you switch TF, and rather than being either too
    // noisy (1m) or too stale (1h+) depending on what you're viewing.
    const SR_INTERVAL = '15min';
    const SR_INTERVAL_SECONDS = INTERVAL_SECONDS[SR_INTERVAL];
    const SR_LOOKBACK_BARS = 52; // ~2 trading days of 15m bars (6.5h regular session -> 26 bars/day)
    const SR_FRACTAL_N = 3; // a bar's high/low must beat N neighbors on EACH side to count as a swing point - higher N = fewer, more significant swings
    const SR_CLUSTER_TOLERANCE_PCT = 0.0015; // swing points within 0.15% of each other's price get grouped into the same level
    const SR_LEVELS_PER_SIDE = 2; // how many resistance/support lines to draw above/below current price

    // GEX walls/flip aggregate gamma x OI across the nearest N
    // expirations, not just whichever one is selected in the EXP dropdown
    // - a single expiration is too small a slice of total open interest
    // to represent real aggregate dealer positioning. 6 matches the
    // existing precedent set by the Big Flow feature (MAX_BIGFLOW_
    // EXPIRATIONS in tradierHub.js) for "how many near-term expirations
    // is a reasonable window" in this app. Each one is a separate chain
    // fetch, so this is also 6x the Tradier API load of the single-
    // expiration version per refresh - worth revisiting if that becomes
    // a rate-limit problem in practice.
    const GEX_EXPIRATION_COUNT = 6;

    // Simplified Gamma Flip approximation: sums SIGNED net GEX (calls
    // positive, puts negative - the standard convention) at each strike,
    // using gamma/OI evaluated AT THE CURRENT SPOT PRICE (the greeks
    // Tradier already computed for us) - not the more rigorous method
    // professional GEX tools use, which re-prices gamma across a whole
    // RANGE of hypothetical spot prices via Black-Scholes and finds
    // where that curve crosses zero. This is a cheaper, directional
    // approximation: sweep strikes low to high, track the running
    // cumulative net GEX, and return the strike nearest to where that
    // running total crosses zero. Good enough to say "roughly here,"
    // not precise enough to treat as the exact regime boundary.
    function computeGammaFlip(callGexByStrike, putGexByStrike) {
      const allStrikes = new Set([...callGexByStrike.keys(), ...putGexByStrike.keys()]);
      const sortedStrikes = [...allStrikes].sort((a, b) => a - b);
      if (sortedStrikes.length === 0) return null;

      let cumulative = 0;
      let prevCumulative = 0;
      let prevStrike = null;
      for (const strike of sortedStrikes) {
        const net = (callGexByStrike.get(strike) || 0) - (putGexByStrike.get(strike) || 0);
        prevCumulative = cumulative;
        cumulative += net;
        if (prevStrike != null && ((prevCumulative < 0 && cumulative >= 0) || (prevCumulative > 0 && cumulative <= 0))) {
          return Math.abs(prevCumulative) <= Math.abs(cumulative) ? prevStrike : strike;
        }
        prevStrike = strike;
      }
      return null; // net GEX never actually crosses zero across the observed strikes
    }

    // Remembers each panel's ticker, timeframe, and indicators across
    // visits, per panel index, so the chart looks the way it was left
    // instead of always resetting to the SPY/QQQ defaults. Read once at
    // startup (loadChartSettings) and written every time one of those
    // three things changes (saveChartSettings) - never on every price
    // tick or anything high-frequency. Wrapped in try/catch since
    // localStorage can throw (private browsing, storage disabled/full).
    function chartSettingsKey(index) {
      return `xnlflow:panel:${index}:settings`;
    }

    function loadChartSettings(index) {
      try {
        const raw = localStorage.getItem(chartSettingsKey(index));
        return raw ? JSON.parse(raw) : null;
      } catch (err) {
        console.error(`[settings] failed to load panel ${index} settings:`, err);
        return null;
      }
    }

    function saveChartSettings(panel) {
      try {
        const settings = {
          symbol: panel.symbol,
          interval: panel.interval,
          srEnabled: panel.srEnabled,
          volumeProfileEnabled: panel.volumeProfileEnabled,
          gexEnabled: panel.gexEnabled,
          macdEnabled: panel.macdEnabled,
          indicators: panel.indicators.map((ind) => ({
            type: ind.type,
            period: ind.period,
            lineStyle: ind.lineStyle,
            lineType: ind.lineType,
          })),
        };
        localStorage.setItem(chartSettingsKey(panel.index), JSON.stringify(settings));
      } catch (err) {
        console.error(`[settings] failed to save panel ${panel.index} settings:`, err);
      }
    }

    async function fetchHistoricalBars(symbol, interval) {
      let response;
      try {
        response = await fetch(`${BACKEND_HTTP}/api/bars?symbol=${encodeURIComponent(symbol)}&interval=${encodeURIComponent(interval)}`);
      } catch (networkErr) {
        throw new Error(`Can't reach the backend at ${BACKEND_HTTP} - it may be waking up from sleep (Render free tier), try again in a moment`);
      }
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || `Backend error: ${response.status}`);
      if (!data.bars || data.bars.length === 0) throw new Error('No bars returned for this symbol');
      return { bars: data.bars, previousClose: data.previousClose || null };
    }

    async function fetchAllExpirations(symbol) {
      const response = await fetch(`${BACKEND_HTTP}/api/expirations?symbol=${encodeURIComponent(symbol)}`);
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || `Backend error: ${response.status}`);
      if (!data.expirations || data.expirations.length === 0) throw new Error('No expirations returned');
      return data.expirations;
    }

    function formatExpirationLabel(dateStr) {
      const d = new Date(`${dateStr}T00:00:00Z`);
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' });
    }

    // Always Eastern Time (market/exchange time) regardless of the
    // viewer's own location - a trader in any timezone still sees the
    // same clock time everyone else trading US markets sees.
    // Uses the viewer's own local browser timezone (no explicit timeZone
    // override) - matches their computer's clock and TradingView's usual
    // default display, so chart time, flow timestamps, and local time
    // all agree with each other.
    function formatTradeTime(timestampMs) {
      return new Date(timestampMs).toLocaleTimeString('en-US', {
        hour: 'numeric', minute: '2-digit', second: '2-digit',
      });
    }

    // tickMarkType: 0=Year, 1=Month, 2=DayOfMonth, 3=Time, 4=TimeWithSeconds -
    // year/month/day ticks should show a date, not a time, particularly
    // relevant now that the 1-day timeframe spans many calendar days.
    function formatChartLocalTime(unixSeconds, tickMarkType) {
      const d = new Date(unixSeconds * 1000);
      if (tickMarkType != null && tickMarkType <= 2) {
        return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      }
      return d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
    }

    function isFuturesTicker(symbol) {
      return /^[A-Z]{1,3}[FGHJKMNQUVXZ]\d$/.test(symbol);
    }

    function computeMA(bars, period) {
      const points = [];
      for (let i = period - 1; i < bars.length; i++) {
        let sum = 0;
        for (let j = i - period + 1; j <= i; j++) sum += bars[j].close;
        points.push({ time: bars[i].time, value: sum / period });
      }
      return points;
    }

    // Standard EMA - seeded with a simple average of the first `period`
    // closes, then smoothed forward from there.
    function computeEMA(bars, period) {
      if (bars.length < period) return [];
      const points = [];
      const multiplier = 2 / (period + 1);
      let sum = 0;
      for (let i = 0; i < period; i++) sum += bars[i].close;
      let ema = sum / period;
      points.push({ time: bars[period - 1].time, value: ema });
      for (let i = period; i < bars.length; i++) {
        ema = (bars[i].close - ema) * multiplier + ema;
        points.push({ time: bars[i].time, value: ema });
      }
      return points;
    }

    // Standard Wilder's-smoothing RSI (same method used by virtually every
    // charting platform) - needs `period` bars just to seed the first
    // average, so the line starts partway into the visible history, same
    // as MA200 did before it was removed.
    function computeRSI(bars, period) {
      if (bars.length <= period) return [];
      const points = [];

      let gainSum = 0;
      let lossSum = 0;
      for (let i = 1; i <= period; i++) {
        const change = bars[i].close - bars[i - 1].close;
        if (change > 0) gainSum += change; else lossSum += -change;
      }
      let avgGain = gainSum / period;
      let avgLoss = lossSum / period;

      const rsiFrom = (ag, al) => (al === 0 ? 100 : 100 - 100 / (1 + ag / al));
      points.push({ time: bars[period].time, value: rsiFrom(avgGain, avgLoss) });

      for (let i = period + 1; i < bars.length; i++) {
        const change = bars[i].close - bars[i - 1].close;
        const gain = change > 0 ? change : 0;
        const loss = change < 0 ? -change : 0;
        avgGain = (avgGain * (period - 1) + gain) / period;
        avgLoss = (avgLoss * (period - 1) + loss) / period;
        points.push({ time: bars[i].time, value: rsiFrom(avgGain, avgLoss) });
      }
      return points;
    }

    // Standard MACD: MACD line = EMA(fast) - EMA(slow) of close price,
    // signal = EMA(signal) of the MACD line itself, histogram = MACD
    // line minus signal. Needs slowPeriod + signalPeriod bars just to
    // produce the first histogram point, same "starts partway into the
    // visible history" tradeoff as RSI above.
    function computeMACD(bars, fastPeriod, slowPeriod, signalPeriod) {
      if (bars.length < slowPeriod + signalPeriod) return { macdLine: [], signalLine: [], histogram: [] };

      // EMA over a plain array of numbers (not bars with .close), so this
      // can run a second time over the MACD line itself for the signal.
      function emaOfValues(values, period) {
        const multiplier = 2 / (period + 1);
        let sum = 0;
        for (let i = 0; i < period; i++) sum += values[i];
        let ema = sum / period;
        const out = [ema];
        for (let i = period; i < values.length; i++) {
          ema = (values[i] - ema) * multiplier + ema;
          out.push(ema);
        }
        return out; // out[k] corresponds to values[period - 1 + k]
      }

      const closes = bars.map((b) => b.close);
      const emaFastAll = emaOfValues(closes, fastPeriod); // starts at bars[fastPeriod - 1]
      const emaSlowAll = emaOfValues(closes, slowPeriod); // starts at bars[slowPeriod - 1]

      // Slow EMA starts later than fast - align them to the point where
      // BOTH exist, which is exactly where the slow one starts.
      const offset = slowPeriod - fastPeriod;
      const macdValues = emaSlowAll.map((slowVal, i) => emaFastAll[i + offset] - slowVal);
      const macdTimes = bars.slice(slowPeriod - 1).map((b) => b.time);

      const signalValues = emaOfValues(macdValues, signalPeriod);
      const signalTimes = macdTimes.slice(signalPeriod - 1);

      const macdLine = macdTimes.map((t, i) => ({ time: t, value: macdValues[i] }));
      const signalLine = signalTimes.map((t, i) => ({ time: t, value: signalValues[i] }));

      const signalByTime = new Map(signalLine.map((p) => [p.time, p.value]));
      const histogram = macdLine
        .filter((p) => signalByTime.has(p.time))
        .map((p) => {
          const diff = p.value - signalByTime.get(p.time);
          return { time: p.time, value: diff, color: diff >= 0 ? 'rgba(0, 200, 83, 0.5)' : 'rgba(255, 82, 82, 0.5)' };
        });

      return { macdLine, signalLine, histogram };
    }

    function createPanel(index, defaultSymbol) {
      const root = document.querySelector(`[data-panel-index="${index}"]`);
      const saved = loadChartSettings(index);
      const initialSymbol = saved?.symbol || defaultSymbol;
      const initialInterval = (saved?.interval && INTERVAL_SECONDS[saved.interval]) ? saved.interval : '1min';
      const initialSrEnabled = saved?.srEnabled !== false; // default on; only off if explicitly saved as off
      const initialVolumeProfileEnabled = saved?.volumeProfileEnabled === true; // default OFF now (was on) - GEX is the new default overlay, this stays available to toggle back on for comparison
      const initialGexEnabled = saved?.gexEnabled !== false; // default on; only off if explicitly saved as off
      const initialMacdEnabled = saved?.macdEnabled !== false; // default on; only off if explicitly saved as off
      const els = {
        tickerInput: root.querySelector('.ticker-input'),
        searchBtn: root.querySelector('.search-btn'),
        replayBtn: root.querySelector('.replay-btn'),
        expirationSelect: root.querySelector('.expiration-select'),
        timeframeSelect: root.querySelector('.timeframe-select'),
        tickerSymbol: root.querySelector('.ticker-symbol'),
        tickerPrice: root.querySelector('.ticker-price'),
        tickerChange: root.querySelector('.ticker-change'),
        wsDebug: root.querySelector('.ws-debug'),
        statusBadge: root.querySelector('.status-badge'),
        chartContainer: root.querySelector('.chart-container'),
        chartErrorBanner: root.querySelector('.chart-error-banner'),
        flowList: root.querySelector('.flow-list'),
        strikeOverlayContainer: root.querySelector('.strike-overlay-container'),
        srLabelContainer: root.querySelector('.sr-label-container'),
        netFlowContainer: root.querySelector('.net-flow-container'),
        candleTimer: root.querySelector('.candle-timer'),
        indicatorToggleBtn: root.querySelector('.indicator-toggle-btn'),
        indicatorPanel: root.querySelector('.indicator-panel'),
        indicatorTypeSelect: root.querySelector('.indicator-type-select'),
        indicatorPeriodInput: root.querySelector('.indicator-period-input'),
        indicatorStyleSelect: root.querySelector('.indicator-style-select'),
        indicatorAddBtn: root.querySelector('.indicator-add-btn'),
        srToggleCheckbox: root.querySelector('.sr-toggle-checkbox'),
        volumeProfileToggleCheckbox: root.querySelector('.volume-profile-toggle-checkbox'),
        macdToggleCheckbox: root.querySelector('.macd-toggle-checkbox'),
        gexToggleCheckbox: root.querySelector('.gex-toggle-checkbox'),
        gexOverlayContainer: root.querySelector('.gex-overlay-container'),
        gexCallWallLabel: root.querySelector('.gex-call-wall-label'),
        gexPutWallLabel: root.querySelector('.gex-put-wall-label'),
        gexFlipLabel: root.querySelector('.gex-flip-label'),
        highAreaLabel: root.querySelector('.high-area-label'),
        lowAreaLabel: root.querySelector('.low-area-label'),
        gexMagnetLabel: root.querySelector('.gex-magnet-label'),
        indicatorList: root.querySelector('.indicator-list'),
      };

      // Reflect the restored (or default) symbol/timeframe in the actual
      // input controls, so the UI matches what's about to load instead of
      // showing the hardcoded HTML default (e.g. input still says "SPY"
      // while a restored TSLA chart loads underneath it).
      els.tickerInput.value = initialSymbol;
      els.timeframeSelect.value = initialInterval;
      els.srToggleCheckbox.checked = initialSrEnabled;
      els.volumeProfileToggleCheckbox.checked = initialVolumeProfileEnabled;
      els.gexToggleCheckbox.checked = initialGexEnabled;
      els.macdToggleCheckbox.checked = initialMacdEnabled;

      const chart = LightweightCharts.createChart(els.chartContainer, {
        autoSize: true,
        layout: { background: { color: '#0b0e14' }, textColor: '#d1d4dc', attributionLogo: false },
        grid: { vertLines: { color: '#1f293d' }, horzLines: { color: '#1f293d' } },
        timeScale: {
          timeVisible: true,
          secondsVisible: false,
          barSpacing: 8,
          tickMarkFormatter: (time, tickMarkType) => formatChartLocalTime(time, tickMarkType),
        },
        localization: {
          timeFormatter: (time) => formatChartLocalTime(time),
        },
        // Four vertical bands sharing this one chart: price (top ~50%),
        // volume, RSI, MACD (bottom-most band).
        rightPriceScale: { scaleMargins: { top: 0.05, bottom: 0.45 } },
      });

      const candlestickSeries = chart.addCandlestickSeries({
        upColor: '#00c853',
        downColor: '#ff5252',
        borderVisible: false,
        wickUpColor: '#00c853',
        wickDownColor: '#ff5252',
        priceLineColor: '#fdd835', // the live current-price line - fixed yellow instead of defaulting to green/red based on up/down direction
      });

      const volumeSeries = chart.addHistogramSeries({
        priceFormat: { type: 'volume' },
        priceScaleId: 'volume',
        priceLineVisible: false,
        lastValueVisible: false,
      });
      chart.priceScale('volume').applyOptions({ scaleMargins: { top: 0.57, bottom: 0.32 } });

      const RSI_PERIOD = 14;
      const rsiSeries = chart.addLineSeries({
        color: '#ba68c8',
        lineWidth: 2,
        priceScaleId: 'rsi',
        priceLineVisible: false,
        lastValueVisible: true,
        title: 'RSI',
      });
      chart.priceScale('rsi').applyOptions({ scaleMargins: { top: 0.70, bottom: 0.17 } });
      // RSI's own scale is fixed 0-100 (not auto-fit to data), so the
      // 70/30 reference lines always sit at their real, meaningful levels.
      rsiSeries.applyOptions({ autoscaleInfoProvider: () => ({ priceRange: { minValue: 0, maxValue: 100 } }) });
      rsiSeries.createPriceLine({ price: 70, color: '#8fa0be', lineWidth: 1, lineStyle: LightweightCharts.LineStyle.Dotted, axisLabelVisible: false });
      rsiSeries.createPriceLine({ price: 30, color: '#8fa0be', lineWidth: 1, lineStyle: LightweightCharts.LineStyle.Dotted, axisLabelVisible: false });

      // MACD (12, 26, 9) - histogram (MACD minus signal) plus the two
      // lines themselves, all sharing one bottom-most band below RSI.
      const MACD_FAST = 12;
      const MACD_SLOW = 26;
      const MACD_SIGNAL = 9;
      const macdHistSeries = chart.addHistogramSeries({
        priceScaleId: 'macd',
        priceLineVisible: false,
        lastValueVisible: false,
      });
      const macdLineSeries = chart.addLineSeries({
        color: '#42a5f5',
        lineWidth: 1,
        priceScaleId: 'macd',
        priceLineVisible: false,
        lastValueVisible: true,
        title: 'MACD',
      });
      const macdSignalSeries = chart.addLineSeries({
        color: '#ff9800',
        lineWidth: 1,
        priceScaleId: 'macd',
        priceLineVisible: false,
        lastValueVisible: false,
      });
      chart.priceScale('macd').applyOptions({ scaleMargins: { top: 0.85, bottom: 0 } });


      const panel = {
        index,
        symbol: initialSymbol,
        active: true,
        hasLoadedOnce: false,
        pendingWatchExpiration: null,
        pendingIndicatorRestore: saved?.indicators || [],
        srLines: [], // currently-drawn support/resistance price lines - cleared and redrawn on each recompute
        sr15mBars: [], // {time, open, high, low, close} - fixed 15m bars for S/R, independent of the chart's displayed timeframe
        sr15mBarTime: null,
        sr15mBarOpen: 0,
        sr15mBarHigh: 0,
        sr15mBarLow: 0,
        srLevels: [], // {price, el} for each level's floating R1/R2/S1/S2 label - repositioned on every price tick/resize/zoom
        srEnabled: initialSrEnabled,
        volumeProfileEnabled: initialVolumeProfileEnabled,
        gexEnabled: initialGexEnabled,
        macdEnabled: initialMacdEnabled,
        chart,
        candlestickSeries,
        volumeSeries,
        rsiSeries,
        macdHistSeries,
        macdLineSeries,
        macdSignalSeries,
        indicators: [], // [{id, type, period, lineStyle, lineType, color, series, currentValue}] - fully user-managed
        closeHistory: [],
        previousClose: null,
        bigFlowEnabled: true,
        interval: initialInterval, // sent to the backend - matches the Timeframe dropdown's value
        intervalSeconds: INTERVAL_SECONDS[initialInterval] || 60, // used to bucket live ticks into the right candle width
        flowMarkers: [],
        netFlowByBarTime: new Map(), // futures only - barTime -> signed net contract count (BUY positive, SELL negative) for trades clearing FUTURES_CHART_MARKER_FLOOR
        pendingSidebarCards: [], // buffer used during Replay's deferRender batching - see renderFlowSidebarCard/addStockFlowMarker
        lastBarTime: null,
        lastBarPrice: 0,
        currentBarVolume: 0,
        lastBarOpen: 0,
        els,
        ws: null,
        wsQueue: [],
      };

      function connectWS() {
        panel.wsConnectCount = (panel.wsConnectCount || 0) + 1;
        console.log(`[ws:${panel.symbol}] connectWS() call #${panel.wsConnectCount} at ${new Date().toLocaleTimeString()}`);

        panel.ws = new WebSocket(BACKEND_WS);

        panel.ws.onopen = () => {
          console.log(`[ws:${panel.symbol}] onopen fired (connect #${panel.wsConnectCount}), hasLoadedOnce=${panel.hasLoadedOnce}`);
          panel.wsQueue.forEach((m) => panel.ws.send(JSON.stringify(m)));
          panel.wsQueue = [];

          if (panel.hasLoadedOnce && panel.active) {
            console.warn(`[ws:${panel.symbol}] RECONNECT-RESEND firing (connect #${panel.wsConnectCount}) - this duplicates the normal load's own subscribe if that already happened`);
            panel.sendWS({ type: 'subscribe_price', symbol: panel.symbol });
            const currentExpiration = els.expirationSelect.value;
            if (currentExpiration) panel.sendWS({ type: 'watch_flow', symbol: panel.symbol, expiration: currentExpiration });
            // Big Flow (6-expiration watch) was previously only ever sent
            // once, on initial load - any later browser-side reconnect
            // (a WiFi blip, laptop sleep, anything) silently dropped it
            // forever with nothing ever re-requesting it, until a full
            // page reload. Resending it here alongside the other two
            // fixes that.
            if (!isFuturesTicker(panel.symbol)) panel.sendWS({ type: 'watch_big_flow', symbol: panel.symbol, spotPrice: panel.lastBarPrice });
          }
        };

        panel.ws.onmessage = (event) => {
          let msg;
          try { msg = JSON.parse(event.data); } catch (e) { return; }

          panel.wsMsgCount = (panel.wsMsgCount || 0) + 1;
          if (msg.type === 'flow') panel.wsFlowCount = (panel.wsFlowCount || 0) + 1;
          const nowStr = new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', second: '2-digit' });
          if (els.wsDebug) els.wsDebug.innerText = `#${panel.wsMsgCount} ${msg.type} @ ${nowStr} (flow seen: ${panel.wsFlowCount || 0})`;

          if (msg.type === 'price' && msg.symbol === panel.symbol) {
            panel.handlePriceTick(msg.price, msg.timeMs, msg.open, msg.high, msg.low, msg.size, msg.volume);
          } else if (msg.type === 'flow' && msg.kind === 'bigflow') {
            const bigFlowThreshold = BIG_FLOW_MAJOR_SYMBOLS.has(panel.symbol) ? BIG_FLOW_THRESHOLD_MAJOR : BIG_FLOW_THRESHOLD_OTHER;
            if (msg.premium < bigFlowThreshold) return;
            // Big Flow watches several expirations, one of which is often
            // the SAME one currently selected in the dropdown - without
            // this check, a trade on that shared expiration shows up
            // twice: once via the normal single-expiration flow, once
            // via this bigflow path. Skip it here since the normal path
            // already displays it.
            if (msg.expiration === els.expirationSelect.value) return;
            panel.addOptionFlowMarker(msg.optionType, msg.strike, msg.premium, msg.timeMs, msg.side, formatExpirationLabel(msg.expiration));
          } else if (msg.type === 'flow') {
            // TEMP DIAGNOSTIC: confirms the message actually reaches this
            // handler at all, and what premium/threshold comparison
            // happens next - remove once the "small flow not appearing"
            // investigation is resolved.
            console.log(`[flow:${panel.symbol}] received type=flow premium=${msg.premium} MIN_FLOW_PREMIUM=${MIN_FLOW_PREMIUM}`);
            if (msg.premium < MIN_FLOW_PREMIUM) return;
            panel.addOptionFlowMarker(msg.optionType, msg.strike, msg.premium, msg.timeMs, msg.side);
          } else if (msg.type === 'flow_watching') {
            console.log(`[flow:${panel.symbol}] watching ${msg.contractCount} contracts, expiration ${msg.expiration}`);
            if (msg.expiration === panel.pendingWatchExpiration) panel.pendingWatchExpiration = null;
          } else if (msg.type === 'big_flow_watching') {
            console.log(`[bigflow:${panel.symbol}] watching ${msg.contractCount} contracts across multiple expirations`);
          } else if (msg.type === 'stock_flow' && msg.symbol === panel.symbol) {
            panel.addStockFlowMarker(msg.size, msg.dollarValue, msg.timeMs, msg.side, msg.sourceSymbol, msg.standardEquivalentSize);
          } else if (msg.type === 'background_flow') {
            // Broadcast to EVERY connected client (see broadcastBackgroundFlow
            // in server.js) rather than filtered per-subscription like
            // everything else here - so with 2 panels open, both would
            // otherwise render the same entry twice. Only panel 0 (which
            // always exists, even in 1-Window mode) renders it.
            if (index === 0) renderBackgroundFlowEntry(msg);
          } else if (msg.type === 'flow_error') {
            console.error(`[flow:${panel.symbol}] ${msg.error}`);
            panel.pendingWatchExpiration = null;
          } else if (msg.type === 'price_feed_status') {
            if (isFuturesTicker(panel.symbol)) return;
            if (msg.status === 'connected') panel.setStatus('Live', '#1b5e20');
            else if (msg.status === 'error') panel.setStatus(`Feed error: ${msg.detail || ''}`, '#7a1f1f');
            else panel.setStatus('Disconnected');
          }
        };

        panel.ws.onerror = (err) => console.error(`[ws:${panel.symbol}] error on connect #${panel.wsConnectCount}`, err);
        panel.ws.onclose = (closeEvent) => {
          console.warn(`[ws:${panel.symbol}] onclose fired (connect #${panel.wsConnectCount}) code=${closeEvent.code} reason=${closeEvent.reason || 'none'} wasClean=${closeEvent.wasClean}`);
          panel.setStatus('Disconnected');
          setTimeout(connectWS, 2000);
        };
      }
      connectWS();

      panel.sendWS = function (msg) {
        if (panel.ws && panel.ws.readyState === WebSocket.OPEN) {
          panel.ws.send(JSON.stringify(msg));
        } else {
          panel.wsQueue.push(msg);
        }
      };

      panel.setStatus = function (text, bg) {
        els.statusBadge.innerText = text;
        if (bg) els.statusBadge.style.backgroundColor = bg;
      };

      panel.showChartError = function (message) {
        if (!message) { els.chartErrorBanner.style.display = 'none'; return; }
        els.chartErrorBanner.innerText = message;
        els.chartErrorBanner.style.display = 'block';
        console.error(`[chart:${panel.symbol}]`, message);
      };

      panel.updatePercentChange = function (price) {
        if (!panel.previousClose) {
          els.tickerChange.innerText = '';
          return;
        }
        const pct = ((price - panel.previousClose) / panel.previousClose) * 100;
        const sign = pct >= 0 ? '+' : '';
        els.tickerChange.innerText = `${sign}${pct.toFixed(2)}%`;
        els.tickerChange.style.color = pct >= 0 ? '#00c853' : '#ff5252';
      };

      panel.centerLastCandle = function () {
        const width = els.chartContainer.clientWidth || 600;
        const actualBars = Math.max(1, panel.closeHistory.length);
        const targetVisibleBars = Math.min(200, actualBars);
        const newBarSpacing = Math.max(2, Math.min(20, width / targetVisibleBars));
        // Roughly half the visible bar count as empty space on the right -
        // puts the last candle near the center of the screen instead of
        // hugging the right edge, so the volume profile overlay (which
        // anchors to the right and extends leftward) has clean room to
        // sit in without overlapping recent price action.
        const rightOffset = Math.round(targetVisibleBars / 2);
        chart.timeScale().applyOptions({ barSpacing: newBarSpacing, rightOffset });
        chart.timeScale().scrollToPosition(rightOffset, false);
        chart.priceScale('right').applyOptions({ autoScale: true });
      };

      panel.pause = function () {
        if (!panel.active) return;
        panel.active = false;
        panel.sendWS({ type: 'unsubscribe_price' });
        panel.sendWS({ type: 'unwatch_flow' });
      };

      panel.resume = function () {
        if (panel.active) return;
        panel.active = true;
        panel.sendWS({ type: 'subscribe_price', symbol: panel.symbol });
        const currentExpiration = els.expirationSelect.value;
        if (currentExpiration) panel.sendWS({ type: 'watch_flow', symbol: panel.symbol, expiration: currentExpiration });
        panel.centerLastCandle();
      };

      panel.renderFlowSidebarCard = function (type, strike, premiumStr, sideLabel, timeStr, expirationLabel, skipCap, deferRender) {
        const isCall = type === 'CALL';
        const card = document.createElement('div');
        card.className = `flow-card ${isCall ? 'call' : 'put'}${expirationLabel ? ' bigflow' : ''}`;
        card.innerHTML = `
          <div class="flow-details">
            ${expirationLabel ? `<span class="flow-bigflow-tag">ALL EXP &middot; ${expirationLabel}</span>` : ''}
            <span class="flow-strike">${panel.symbol} ${strike} ${type}</span>
            <span style="color: #8fa0be; font-size: 11px;">${sideLabel || 'BOUGHT'}${timeStr ? ' &middot; ' + timeStr : ''}</span>
          </div>
          <span class="flow-premium">${premiumStr}</span>
        `;
        if (deferRender) {
          // Buffered instead of touching the DOM directly - hundreds of
          // individual prepend() calls (one per Replay event) was itself
          // enough raw DOM-mutation cost to visibly hang the tab, even
          // after removing the O(n^2) marker/net-flow redraws. Replay
          // flushes this buffer into a single batched insertion once,
          // after its loop finishes.
          panel.pendingSidebarCards.push(card);
          return;
        }
        els.flowList.prepend(card);
        if (!skipCap && els.flowList.children.length > SIDEBAR_FLOW_MAX) els.flowList.removeChild(els.flowList.lastChild);
      };

      // Flow events (especially ones replayed from the server's rolling
      // history buffer on page load / reconnect) carry the REAL time the
      // trade happened, which can be well in the past - markers were
      // previously always pinned to panel.lastBarTime, so a whole batch
      // of replayed history all visually landed on the current candle.
      // This buckets the real timestamp into the chart's own interval,
      // then snaps to the closest candle that actually exists on the
      // chart (via closeHistory) - a marker's time has to match a real
      // data point to render, and thin/gappy periods mean the exact
      // bucket doesn't always have a candle.
      panel.resolveMarkerTime = function (timestampMs) {
        const history = panel.closeHistory;
        if (!timestampMs || !panel.intervalSeconds || !history || !history.length) return panel.lastBarTime;
        const tradeTime = Math.floor(timestampMs / 1000);
        const bucket = Math.floor(tradeTime / panel.intervalSeconds) * panel.intervalSeconds;
        if (bucket <= history[0].time) return history[0].time;
        if (bucket >= history[history.length - 1].time) return history[history.length - 1].time;
        let candidate = history[0].time;
        for (let i = 0; i < history.length; i++) {
          if (history[i].time <= bucket) candidate = history[i].time;
          else break;
        }
        return candidate;
      };

      panel.addOptionFlowMarker = function (type, strike, premiumVal, timestamp, side, expirationLabel, skipCap, deferRender) {
        // TEMP DIAGNOSTIC: confirms whether this guard is the thing
        // silently dropping flow events (nothing renders, no error, no
        // trace) - remove once the "small flow not appearing" investigation
        // is resolved.
        if (!panel.lastBarTime) {
          console.warn(`[flow:${panel.symbol}] DROPPED - lastBarTime not set yet. type=${type} strike=${strike} premium=${premiumVal}`);
          return;
        }

        const isCall = type === 'CALL';
        const isSold = side === 'SOLD';
        const formattedPrem = `$${(premiumVal / 1000).toFixed(0)}k`;
        const sideLabel = side || 'BOUGHT';
        const timeStr = timestamp ? formatTradeTime(timestamp) : '';

        panel.renderFlowSidebarCard(type, strike, formattedPrem, sideLabel, timeStr, expirationLabel, skipCap, deferRender);

        if (premiumVal < CHART_MARKER_PREMIUM_FLOOR) return;

        // SOLD markers intentionally swap position/shape relative to
        // BOUGHT (a sold put sits below the candle pointing up, a sold
        // call sits above pointing down - opposite of where that same
        // option type would sit if bought) and use one shared cyan color
        // for both, rather than the normal call=green/put=red split -
        // makes "this was a SOLD print" visually distinct at a glance
        // instead of only readable from the marker's text label.
        const position = isSold ? (isCall ? 'aboveBar' : 'belowBar') : (isCall ? 'belowBar' : 'aboveBar');
        const shape = isSold ? (isCall ? 'arrowDown' : 'arrowUp') : (isCall ? 'arrowUp' : 'arrowDown');
        const color = isSold ? '#00e5ff' : (isCall ? '#00c853' : '#ff5252');

        panel.flowMarkers.push({
          time: panel.resolveMarkerTime(timestamp),
          position,
          color,
          shape,
          text: `${expirationLabel ? `[${expirationLabel}] ` : ''}${sideLabel === 'SOLD' ? 'S' : 'B'} ${type} $${strike} (${formattedPrem})`,
          size: MARKER_SIZE,
          isCall,
          side: sideLabel,
        });
        if (!skipCap && panel.flowMarkers.length > CHART_MARKER_MAX) panel.flowMarkers.shift();

        // Replaying hundreds of saved events would otherwise call this on
        // EVERY single one, redrawing the growing marker array from
        // scratch each time - O(n^2) work that visibly freezes the tab
        // once there's enough saved history (the ES/NQ/GC background
        // watch running continuously is exactly what produces that much
        // volume). Replay passes deferRender=true and does this once,
        // after its loop finishes, instead.
        if (!deferRender) candlestickSeries.setMarkers(panel.flowMarkers);
      };

      // Large trades on the underlying STOCK's shares (not options) -
      // separate from the option-flow functions above since shares don't
      // have a strike/type/expiration, just size and dollar value.
      panel.addStockFlowMarker = function (shareSize, dollarValue, timestamp, side, sourceSymbol, standardEquivalentSize, skipCap, deferRender) {
        if (!panel.lastBarTime) return;

        const isFutures = isFuturesTicker(panel.symbol);
        const unitLabel = isFutures ? 'CTs' : 'sh';
        const tagLabel = isFutures ? '' : 'SHARES'; // futures cards drop the tag entirely - the "NQU6: X CTs" format is self-explanatory
        const isBuy = side === 'BUY';
        const formattedVal = dollarValue >= 1_000_000 ? `$${(dollarValue / 1_000_000).toFixed(2)}M` : `$${(dollarValue / 1000).toFixed(0)}k`;
        const timeStr = timestamp ? formatTradeTime(timestamp) : '';
        // Present when a micro/standard sibling contract's trade is being
        // shown under this panel's symbol - without this, per-contract
        // dollar math looks inconsistent (a micro contract's multiplier
        // is 1/10th the standard one, so far more contracts are needed
        // for the same dollar value).
        const viaStr = sourceSymbol ? ` (via ${sourceSymbol})` : '';

        // Futures: contract count (standard-equivalent, so a micro fill
        // shows on the same scale as the standard contract), formatted
        // as "NQU6: 4 CTs" with the dollar value in its own colored
        // span (primaryText below) - same layout as stocks, so the $
        // total gets the same green(buy)/red(sell) coloring via the
        // existing .flow-card.call/.put .flow-premium CSS rules.
        const contractCount = standardEquivalentSize != null ? standardEquivalentSize : shareSize;
        const isWholeNumber = Math.abs(contractCount - Math.round(contractCount)) < 0.05;
        const formattedContracts = isWholeNumber ? Math.round(contractCount).toLocaleString('en-US') : contractCount.toFixed(1);
        const formattedSize = shareSize.toLocaleString('en-US');

        const primaryText = formattedVal;
        const secondaryLine = `${isBuy ? 'BOUGHT' : 'SOLD'}${timeStr ? ' &middot; ' + timeStr : ''}`;
        const detailLine = isFutures
          ? `${panel.symbol}: ${formattedContracts} ${unitLabel}${viaStr}`
          : `${panel.symbol} ${formattedSize} ${unitLabel}${viaStr}`;

        const card = document.createElement('div');
        card.className = `flow-card stockflow ${isBuy ? 'call' : 'put'}`;
        card.innerHTML = `
          <div class="flow-details">
            ${tagLabel ? `<span class="flow-stockflow-tag">${tagLabel}</span>` : ''}
            <span class="flow-strike">${detailLine}</span>
            <span style="color: #8fa0be; font-size: 11px;">${secondaryLine}</span>
          </div>
          ${primaryText ? `<span class="flow-premium">${primaryText}</span>` : ''}
        `;
        if (deferRender) {
          panel.pendingSidebarCards.push(card);
        } else {
          els.flowList.prepend(card);
          if (!skipCap && els.flowList.children.length > SIDEBAR_FLOW_MAX) els.flowList.removeChild(els.flowList.lastChild);
        }

        // Net flow per candle (futures only) - EVERY qualifying trade that
        // made it into the sidebar (the server already filtered to $2M+/
        // $3M+ before ever sending it here), summed with sign (BUY
        // positive, SELL negative) into one running total per candle.
        // Deliberately NOT gated by FUTURES_CHART_MARKER_FLOOR below -
        // that floor only controls which trades get their own arrow (to
        // avoid visual clutter), but Net is a single aggregate number per
        // candle, not an arrow-per-trade, so it should reflect everything
        // that actually happened, not just the largest prints. Uses the
        // same resolveMarkerTime bucketing so it always lines up with
        // whichever candle a marker for this trade would land on.
        if (isFutures) {
          const barTime = panel.resolveMarkerTime(timestamp);
          const contribution = isBuy ? contractCount : -contractCount;
          panel.netFlowByBarTime.set(barTime, (panel.netFlowByBarTime.get(barTime) || 0) + contribution);
          // Same O(n^2) reasoning as the setMarkers guard above -
          // positionNetFlowLabels rebuilds the ENTIRE net-flow container's
          // HTML from scratch every time it's called, so calling it once
          // per event during a large Replay is the other half of what
          // was freezing the tab.
          if (!deferRender) panel.positionNetFlowLabels();
        }

        // Futures large-trades get their own, higher, separately-adjustable
        // chart-marker floor - the sidebar still shows everything the
        // server already decided was worth broadcasting ($2M+), but the
        // chart itself only gets an arrow above this floor, to avoid the
        // crowding that comes from combining ES/MES (or NQ/MNQ) flow into
        // one busy panel.
        if (isFutures && dollarValue < FUTURES_CHART_MARKER_FLOOR) return;

        panel.flowMarkers.push({
          time: panel.resolveMarkerTime(timestamp),
          position: isBuy ? 'belowBar' : 'aboveBar',
          color: isBuy ? '#00c853' : '#ff5252',
          shape: isBuy ? 'arrowUp' : 'arrowDown',
          text: isFutures
            ? `${isBuy ? 'B' : 'S'} ${formattedContracts} ${unitLabel}${viaStr} (${formattedVal})`
            : `${isBuy ? 'B' : 'S'} ${formattedSize} ${unitLabel}${viaStr} (${formattedVal})`,
          size: MARKER_SIZE,
        });
        if (!skipCap && panel.flowMarkers.length > CHART_MARKER_MAX) panel.flowMarkers.shift();

        if (!deferRender) candlestickSeries.setMarkers(panel.flowMarkers);
      };

      // Renders one label per candle that has qualifying futures flow,
      // positioned just above that candle's own high - green for net
      // buying, red for net selling. Rebuilds the whole container each
      // call rather than diffing individual labels (simplest correct
      // approach; net flow only changes at most once per qualifying
      // trade, not on every tick, so this isn't a hot path).
      panel.positionNetFlowLabels = function () {
        if (!isFuturesTicker(panel.symbol) || panel.netFlowByBarTime.size === 0) {
          els.netFlowContainer.innerHTML = '';
          return;
        }
        const height = els.chartContainer.clientHeight || 0;
        const width = els.chartContainer.clientWidth || 0;
        const bars = candlestickSeries.data();
        const barByTime = new Map(bars.map((b) => [b.time, b]));

        const html = [];
        for (const [barTime, net] of panel.netFlowByBarTime) {
          const bar = barByTime.get(barTime);
          if (!bar) continue; // candle has since scrolled out of the loaded data - nothing to anchor the label to
          const isPositive = net >= 0;
          const x = chart.timeScale().timeToCoordinate(barTime);
          const y = candlestickSeries.priceToCoordinate(isPositive ? bar.high : bar.low);
          if (x == null || y == null || x < 0 || x > width || y < 0 || y > height) continue;

          const isWholeNumber = Math.abs(net - Math.round(net)) < 0.05;
          const formattedNet = isWholeNumber ? Math.round(net) : net.toFixed(1);
          const sign = net > 0 ? '+' : ''; // Math.round/toFixed already include the minus sign for negatives
          const color = isPositive ? '#00c853' : '#ff5252';
          const posClass = isPositive ? '' : ' below';
          const topOffset = isPositive ? y - 2 : y + 2;
          html.push(`<div class="net-flow-label${posClass}" style="left:${x}px; top:${topOffset}px; color:${color};">${sign}${formattedNet}</div>`);
        }
        els.netFlowContainer.innerHTML = html.join('');
      };

      // Fetches the fixed 15m bar history S/R runs on (independent of
      // whatever timeframe the chart itself is displaying) and seeds the
      // running-bar state so live ticks continue building from the right
      // baseline. Called on initial load and every ticker switch.
      panel.fetchSr15mBars = async function (symbol) {
        try {
          const result = await fetchHistoricalBars(symbol, SR_INTERVAL);
          const bars = (result.bars || []).slice(-SR_LOOKBACK_BARS);
          panel.sr15mBars = bars.map((b) => ({ time: b.time, open: b.open, high: b.high, low: b.low, close: b.close }));
          const last = panel.sr15mBars[panel.sr15mBars.length - 1];
          if (last) {
            panel.sr15mBarTime = last.time;
            panel.sr15mBarOpen = last.open;
            panel.sr15mBarHigh = last.high;
            panel.sr15mBarLow = last.low;
          } else {
            panel.sr15mBarTime = null;
          }
        } catch (err) {
          console.error(`[sr15m:${symbol}] failed to load 15m bar history:`, err);
          panel.sr15mBars = [];
          panel.sr15mBarTime = null;
        }
      };

      // Maintains panel.sr15mBars from live ticks, entirely independent of
      // the displayed chart's timeframe/bucket - this is what keeps S/R
      // levels stable across TF switches instead of jumping around. Only
      // triggers a recompute when a 15m bar actually CLOSES, not on every
      // tick - same "stable, not twitchy" intent the original design had.
      panel.updateSr15mBars = function (tradePrice, timeMs, hasAggregateRange, aggHigh, aggLow) {
        const tradeTime = Math.floor(timeMs / 1000);
        const bucket = Math.floor(tradeTime / SR_INTERVAL_SECONDS) * SR_INTERVAL_SECONDS;
        if (panel.sr15mBarTime != null && bucket < panel.sr15mBarTime) return; // late/stale update

        const high = hasAggregateRange ? aggHigh : tradePrice;
        const low = hasAggregateRange ? aggLow : tradePrice;

        if (bucket > panel.sr15mBarTime) {
          panel.sr15mBarTime = bucket;
          panel.sr15mBarOpen = tradePrice;
          panel.sr15mBarHigh = high;
          panel.sr15mBarLow = low;
          panel.sr15mBars.push({ time: bucket, open: tradePrice, high, low, close: tradePrice });
          if (panel.sr15mBars.length > SR_LOOKBACK_BARS) panel.sr15mBars.shift();
          panel.computeAndDrawSupportResistance();
        } else {
          panel.sr15mBarHigh = Math.max(panel.sr15mBarHigh, high);
          panel.sr15mBarLow = Math.min(panel.sr15mBarLow, low);
          const last = panel.sr15mBars[panel.sr15mBars.length - 1];
          if (last) {
            last.high = panel.sr15mBarHigh;
            last.low = panel.sr15mBarLow;
            last.close = tradePrice;
          }
        }
      };

      panel.handlePriceTick = function (tradePrice, timeMs, aggOpen, aggHigh, aggLow, tradeSize, aggVolume) {
        // Defensive guard - a crash here (tradePrice not a real number)
        // was observed in practice and its exact cause isn't confirmed
        // yet. This stops it from breaking the whole tick (which was
        // also silently preventing flow/RSI/MA updates from running),
        // and logs the actual bad value so the real source can be found.
        if (typeof tradePrice !== 'number' || !Number.isFinite(tradePrice)) {
          console.error(`[price:${panel.symbol}] handlePriceTick got a non-numeric tradePrice:`, tradePrice, 'timeMs:', timeMs);
          return;
        }
        const tradeTime = Math.floor(timeMs / 1000);
        const currentMinuteBucket = Math.floor(tradeTime / panel.intervalSeconds) * panel.intervalSeconds;
        // A late-arriving update describing an already-superseded bucket
        // (e.g. an AM message for a minute that finished just as newer
        // trade ticks had already started the next bar) - ignore it
        // entirely, including price/MA/RSI display, to avoid the price
        // text and the candle disagreeing with each other.
        if (panel.lastBarTime != null && currentMinuteBucket < panel.lastBarTime) return;

        // Futures aggregates arrive as a complete already-formed bar (its
        // own real open/high/low), not a single raw trade - using those
        // directly avoids plotting a flat, zero-range sliver where the
        // bar's actual range should be. Stocks (raw ticks via Finnhub)
        // don't pass these, so they keep synthesizing range from
        // individual tick comparisons as before.
        const hasAggregateRange = aggHigh != null && aggLow != null;

        // TEMP DIAGNOSTIC: same check we used to find and fix the
        // futures volume bug, now checking stocks specifically. Shows
        // exactly what each live tick contributes to volume - helps
        // tell apart "ticks aren't arriving," "ticks arrive but with
        // size=0/undefined" (a real bug, same shape as the futures
        // one), and "volume IS accumulating, just slowly" (e.g. thin
        // IEX coverage on SPY/QQQ specifically - a data-source
        // limitation, not a bug). Remove once resolved.
        console.log(`[vol:${panel.symbol}] tick price=${tradePrice} tradeSize=${tradeSize} aggVolume=${aggVolume} currentBarVolume(before)=${panel.currentBarVolume}`);

        // Independent of the displayed-chart bucket logic below - S/R now
        // runs on its own fixed 15m series regardless of what TF is on
        // screen (see panel.updateSr15mBars above).
        panel.updateSr15mBars(tradePrice, timeMs, hasAggregateRange, aggHigh, aggLow);

        if (currentMinuteBucket > panel.lastBarTime) {
          panel.lastBarTime = currentMinuteBucket;
          panel.lastBarOpen = hasAggregateRange && aggOpen != null ? aggOpen : tradePrice;
          panel.currentBarHigh = hasAggregateRange ? aggHigh : tradePrice;
          panel.currentBarLow = hasAggregateRange ? aggLow : tradePrice;
          // New candle - volume starts fresh. An Aggregates message
          // carries the bar's own authoritative running total (use it
          // directly); a raw trade tick only knows about itself, so start
          // the accumulator at this one trade's size.
          panel.currentBarVolume = aggVolume != null ? aggVolume : (tradeSize || 0);
          candlestickSeries.update({
            time: currentMinuteBucket, open: panel.lastBarOpen, high: panel.currentBarHigh, low: panel.currentBarLow, close: tradePrice,
          });
          volumeSeries.update({
            time: currentMinuteBucket,
            value: panel.currentBarVolume,
            color: tradePrice >= panel.lastBarOpen ? 'rgba(0, 200, 83, 0.5)' : 'rgba(255, 82, 82, 0.5)',
          });
          panel.closeHistory.push({ time: currentMinuteBucket, close: tradePrice });
        } else {
          // Accumulate the TRUE high/low across every tick this bar has
          // seen so far - comparing only the last two ticks (the
          // previous bug) collapses the wick down to almost nothing,
          // since most consecutive ticks don't move much on their own.
          panel.currentBarHigh = Math.max(panel.currentBarHigh, hasAggregateRange ? aggHigh : tradePrice);
          panel.currentBarLow = Math.min(panel.currentBarLow, hasAggregateRange ? aggLow : tradePrice);
          // Same as above: an Aggregates snapshot REPLACES the running
          // total (it already reflects everything up to now), a raw trade
          // tick only ever ADDS its own size to what's already there.
          panel.currentBarVolume = aggVolume != null ? aggVolume : (panel.currentBarVolume || 0) + (tradeSize || 0);
          candlestickSeries.update({
            time: panel.lastBarTime,
            open: panel.lastBarOpen,
            high: panel.currentBarHigh,
            low: panel.currentBarLow,
            close: tradePrice,
          });
          volumeSeries.update({
            time: panel.lastBarTime,
            value: panel.currentBarVolume,
            color: tradePrice >= panel.lastBarOpen ? 'rgba(0, 200, 83, 0.5)' : 'rgba(255, 82, 82, 0.5)',
          });
          if (panel.closeHistory.length > 0) {
            panel.closeHistory[panel.closeHistory.length - 1].close = tradePrice;
          }
        }

        const hist = panel.closeHistory;
        // Live-update every user-added indicator. MA can update
        // incrementally from the tail of history; EMA is inherently
        // sequential/cumulative, so it's recomputed fully each tick
        // (same approach RSI already uses) - cheap given the small
        // array size, and avoids subtle incremental-state bugs.
        panel.indicators.forEach((ind) => {
          if (ind.type === 'EMA') {
            const points = computeEMA(hist, ind.period);
            ind.series.setData(points);
            ind.currentValue = points.length ? points[points.length - 1].value : null;
          } else {
            if (hist.length < ind.period) { ind.currentValue = null; return; }
            let sum = 0;
            for (let i = hist.length - ind.period; i < hist.length; i++) sum += hist[i].close;
            ind.currentValue = sum / ind.period;
            ind.series.update({ time: panel.lastBarTime, value: ind.currentValue });
          }
        });
        rsiSeries.setData(computeRSI(hist, RSI_PERIOD));
        panel.updateMacd(hist);

        els.tickerPrice.innerText = `$${tradePrice.toFixed(2)}`;
        els.tickerPrice.style.color = tradePrice >= panel.lastBarPrice ? '#00c853' : '#ff5252';
        panel.updatePercentChange(tradePrice);
        panel.lastBarPrice = tradePrice;
        panel.positionWallLabels();
        panel.applyGexWallRegimeStyle();
        panel.positionStrikeOverlay();
        panel.positionGexOverlay();
        panel.positionCandleTimer();
        panel.positionSRLabels();
        panel.positionNetFlowLabels();
      };

      panel.wallRefreshTimer = null;
      panel.strikeOverlayData = []; // [{strike, c, p, cPct, pPct, isWallRow}] - rendered by positionStrikeOverlay
      panel.gexCallWallLine = null;
      panel.gexPutWallLine = null;
      panel.gexCallWallPrice = null;
      panel.gexPutWallPrice = null;
      panel.gexFlipLine = null;
      panel.gexFlipPrice = null;
      panel.highAreaLine = null;
      panel.lowAreaLine = null;
      panel.highAreaPrice = null;
      panel.lowAreaPrice = null;
      panel.gexMagnetLine = null;
      panel.gexMagnetPrice = null;
      panel.gexStrikeData = []; // [{strike, c, p, isWallRow}] - gamma x OI per strike, rendered by positionGexOverlay

      let indicatorIdCounter = 0;
      const INDICATOR_COLOR_PALETTE = ['#ffeb3b', '#2196f3', '#e91e63', '#00bcd4', '#ff9800', '#9c27b0', '#4caf50', '#f44336'];

      panel.computeIndicatorPoints = function (indicator) {
        return indicator.type === 'EMA' ? computeEMA(panel.closeHistory, indicator.period) : computeMA(panel.closeHistory, indicator.period);
      };

      panel.recomputeIndicator = function (indicator) {
        const points = panel.computeIndicatorPoints(indicator);
        indicator.series.setData(points);
        indicator.currentValue = points.length ? points[points.length - 1].value : null;
      };

      panel.recomputeAllIndicators = function () {
        panel.indicators.forEach((ind) => panel.recomputeIndicator(ind));
      };

      panel.renderIndicatorList = function () {
        els.indicatorList.innerHTML = panel.indicators.length
          ? panel.indicators.map((ind) => (
              `<div class="indicator-list-row">` +
              `<span class="indicator-swatch" style="background-color:${ind.color};"></span>` +
              `<span class="indicator-list-label">${ind.type}${ind.period}</span>` +
              `<button class="indicator-remove-btn" data-id="${ind.id}">&times;</button>` +
              `</div>`
            )).join('')
          : 'No indicators added';
      };

      panel.addIndicator = function (type, period, lineStyle, lineType) {
        const id = `ind${indicatorIdCounter++}`;
        const color = INDICATOR_COLOR_PALETTE[panel.indicators.length % INDICATOR_COLOR_PALETTE.length];
        const series = chart.addLineSeries({
          color,
          lineWidth: 2,
          lineStyle,
