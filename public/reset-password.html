<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Reset your password - XNL Flow</title>
  <style>
    body {
      background-color: #0b0e14;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      width: 320px;
      max-width: calc(100vw - 32px);
      background-color: #131822;
      border: 1px solid #1f293d;
      border-radius: 12px;
      padding: 28px 24px;
      text-align: center;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 4px;
    }
    p.subtitle {
      color: #8fa0be;
      font-size: 13px;
      margin: 0 0 20px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      background-color: #1f293d;
      color: #ffffff;
      border: 1px solid #364153;
      border-radius: 6px;
      padding: 9px 10px;
      font-size: 13px;
      margin-bottom: 10px;
    }
    button {
      width: 100%;
      background-color: #2b3548;
      color: #ffffff;
      border: 1px solid #364153;
      border-radius: 6px;
      padding: 9px 10px;
      font-size: 13px;
      cursor: pointer;
    }
    button:hover {
      background-color: #364153;
    }
    #status {
      margin-top: 14px;
      font-size: 12px;
      min-height: 16px;
    }
    #status.error {
      color: #ff5252;
    }
    #status.success {
      color: #00c853;
    }
    a {
      color: #8fa0be;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Reset your password</h1>
    <p class="subtitle">Enter a new password for your XNL Flow account</p>
    <input type="password" id="new-password-input" placeholder="New password" />
    <input type="password" id="confirm-password-input" placeholder="Confirm new password" />
    <button id="reset-btn">Set new password</button>
    <div id="status"></div>
  </div>

  <script>
    const BACKEND_HTTP = window.location.origin;
    const statusEl = document.getElementById('status');

    function setStatus(text, kind) {
      statusEl.textContent = text || '';
      statusEl.className = kind || '';
    }

    const token = new URLSearchParams(window.location.search).get('token');
    if (!token) {
      setStatus('This link is missing a reset token. Please request a new one from the sign-in page.', 'error');
      document.getElementById('reset-btn').disabled = true;
    }

    document.getElementById('reset-btn').addEventListener('click', async () => {
      const newPassword = document.getElementById('new-password-input').value;
      const confirmPassword = document.getElementById('confirm-password-input').value;

      if (!newPassword || newPassword.length < 8) {
        setStatus('Password must be at least 8 characters.', 'error');
        return;
      }
      if (newPassword !== confirmPassword) {
        setStatus('Passwords don\'t match.', 'error');
        return;
      }

      setStatus('Setting new password...', '');
      try {
        const res = await fetch(`${BACKEND_HTTP}/auth/password/reset`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ token, newPassword }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Request failed');

        setStatus('Password updated - redirecting...', 'success');
        setTimeout(() => { window.location.href = '/'; }, 1200);
      } catch (err) {
        console.error('[auth] password reset failed:', err);
        setStatus(err.message || 'Something went wrong - please try again.', 'error');
      }
    });

    document.getElementById('confirm-password-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') document.getElementById('reset-btn').click();
    });
  </script>
</body>
</html>
